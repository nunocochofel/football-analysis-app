name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'resources/linha/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # resources/linha/ is the whole web app (index.html + manifest.json + sw.js + icons/),
          # entirely self-contained with only relative asset paths, so it can be served as-is from
          # the Pages root with no build step or path rewriting.
          path: resources/linha
      - id: deployment
        uses: actions/deploy-pages@v4
