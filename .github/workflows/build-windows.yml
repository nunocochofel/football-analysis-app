name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.86 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Correção: vídeo pequeno com barras pretas — o vídeo passa a ser o elemento principal**

            Diagnóstico confirmado por medição real: `object-fit:contain` nunca corta a imagem,
            preserva sempre a proporção — quando a caixa à volta do vídeo tem uma proporção
            diferente da do vídeo, o espaço que sobra é inevitavelmente pintado a preto. O problema
            não era esse comportamento em si, era a caixa estar desproporcionalmente larga por
            várias coisas a roubar-lhe altura sem necessidade: a barra de cima tinha uma 2ª fila
            (Time A/B), e a nota do clipe (v0.8.85) ficava entre o vídeo e os controlos.

            - Barra de cima já não quebra nunca para uma 2ª fila: "Posse" passa a popup (como já
            acontecia no quadro tático), e os marcadores rápidos por equipa colapsam para um popup
            "⋯ Mais" só quando a janela é mesmo estreita a mais para caber tudo.
            - A nota do clipe mudou-se para depois da linha temporal, no fim da coluna, e passa a
            **recolhível — fechada por omissão**: só ocupa espaço quando se opta por abrir. Um
            pontinho 📝 no cabeçalho mostra se o clipe atual já tem nota escrita, mesmo fechada.
            - Resultado medido (Electron real, vídeo 1280×720): o vídeo cresce de ~489px para
            ~560px de altura na mesma janela — as barras laterais que sobravam ficam residuais.
            - Atalhos continuam suspensos ao escrever na nota (sem mudanças aí — é a mesma regra de
            sempre). Nada disto altera dados guardados.

            Verificado com testes automatizados reais (Electron + Playwright, 23 cenários, mais 16
            num iPad simulado em retrato e paisagem, com o encolhimento de viewport que o teclado do
            ecrã provoca).
