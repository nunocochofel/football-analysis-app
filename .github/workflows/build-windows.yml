name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.74 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Ronda de estabilização (2/N): a ferramenta volta sozinha à seleção depois de
            desenhar**

            Comportamento tipo PowerPoint/Google Slides: ao terminar qualquer forma, a ferramenta
            volta automaticamente a "mover" e a forma que se acabou de desenhar fica logo
            selecionada, com as alças visíveis — pronta a mover, redimensionar ou mudar de cor sem
            ir à barra trocar de ferramenta. Antes disto, a ferramenta ficava armada e era fácil
            continuar a desenhar sem querer.

            - Aplica-se a todas as ferramentas de desenho: linha, seta, seta poligonal, mão livre,
            curva, zona, elipse, retângulo, triângulo e texto.
            - Nas ferramentas de vários pontos (zona, seta poligonal), só volta à seleção quando a
            forma está terminada (duplo-clique a fechar), não a cada ponto.
            - Texto entra logo em modo de edição ao ser colocado, sem precisar de um duplo-clique
            extra — e os atalhos de letra continuam suspensos enquanto se escreve, como já
            acontecia.
            - **Fixar uma ferramenta** — duplo-clique no botão de uma ferramenta de desenho
            mantém-na ativa depois de cada forma (a mesma convenção do PowerPoint/Google Slides/
            draw.io), para desenhar várias seguidas sem trocar de ferramenta a cada uma. Um ponto
            no canto do botão mostra quando está fixa; um simples clique (mesmo na mesma
            ferramenta) desarma-a sempre.

            Testado (47 verificações reais, Playwright + Electron): as 7 ferramentas de
            arrastar-e-largar mais zona e seta poligonal, cada uma confirmada a voltar a "mover"
            com a forma selecionada e as alças visíveis; zona confirmada a NÃO voltar a cada um
            dos 5 pontos, só ao fechar; texto confirmado a abrir o editor de imediato; fixar uma
            ferramenta por duplo-clique confirmado a manter duas formas seguidas sem trocar, e um
            clique simples confirmado a desarmar; gravação de cena e exportação de vídeo (MP4)
            confirmadas sem alterações.
