name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.62 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Quadro tático: duplicar, copiar/colar a sério, camadas e bloquear**

            - **Duplicar** — Ctrl+D ou o novo botão ⧉ clona a seleção inteira (desenhos e
            bonecos juntos), com um pequeno desvio para nunca ficar escondido por baixo do
            original, e já fica selecionado para continuares logo a trabalhar nele.
            - **Copiar/colar evoluído** — Ctrl+C/Ctrl+V no quadro tático passam a copiar o que
            está selecionado, não o que o rato calha estar a sobrevoar. Funciona com vários
            objetos ao mesmo tempo.
            - **Camadas** — `[` e `]`, ou o novo menu de contexto, enviam a seleção para trás ou
            trazem-na para a frente de tudo o resto.
            - **Bloquear** — protege um desenho ou boneco de ser mexido sem querer enquanto
            desenhas por cima: um objeto bloqueado deixa de responder a clique, à caixa de
            seleção e à borracha. O clique direito continua sempre a funcionar nele — é o único
            caminho de volta, incluindo para o desbloquear.

            Testado (28 verificações reais, Playwright + Electron): duplicar forma+boneco juntos
            num só Ctrl+Z para desfazer tudo; copiar/colar comprovadamente pela seleção (testado
            com o rato deliberadamente longe do objeto); reordenar camadas por teclado e por
            menu; um objeto bloqueado confirmado imune a clique/caixa/borracha mas continua
            acessível por clique direito, e as alças de transformar nunca aparecem nele mesmo
            selecionado dessa forma; um projeto gravado antes desta versão (sem o novo campo de
            bloqueio) continua a abrir e a funcionar sem alterações; a exportação de vídeo das
            cenas (MP4) confirmada ponta-a-ponta com ffmpeg real.
