name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.85 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Nova: nota livre por marcação, por baixo do vídeo**

            Cada marcação/clipe (já é a mesma entidade neste modelo — não existiam separados) pode
            agora ter uma nota de texto livre. Caixa por baixo do vídeo, sempre visível enquanto um
            clipe está em edição ("🖊 Editar desenhos") — sem precisar de abrir nada. Guarda
            sozinha, sem botão: enquanto escreve (curto debounce) e imediatamente ao sair do campo.
            Ao mudar de clipe a caixa troca sempre para a nota desse clipe, nunca fica com a
            anterior. Um pontinho 📝 assinala quais têm nota, na lista de clipes e na timeline do
            vídeo.

            - Atalhos de teclado (categorias, espaço, setas) já ficam automaticamente suspensos ao
            escrever aqui — é a mesma regra que já protegia qualquer campo de texto da app,
            confirmado a escrever uma frase longa com espaços sem disparar play/pause nem criar
            marcações por acidente.
            - Aditivo aos dados: um clipe antigo sem nota abre normalmente com a caixa vazia.
            - Funciona em PWA/iPad: confirmado que o teclado do ecrã não tapa a caixa nem empurra o
            vídeo para fora da vista.

            Verificado com testes automatizados reais (Electron + Playwright, 22 cenários, mais 9
            adicionais num iPad simulado para o comportamento com teclado no ecrã).
