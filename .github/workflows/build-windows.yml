name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.70 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Quadro tático: atalhos de teclado, uma letra por ferramenta**

            - Cada ferramenta de desenho tem agora uma tecla própria: **R** Linha · **S** Seta ·
            **V** Seta poligonal · **L** Mão livre · **C** Curva · **Z** Zona · **O** Oval/elipse
            · **T** Texto. A letra aparece na dica (tooltip) do próprio botão.
            - **?** abre o Tutorial, com a lista completa de atalhos.
            - Os atalhos ficam sempre suspensos enquanto escreves em qualquer campo de texto
            (nome de jogador, categoria, caixa de texto do quadro, etc.) — nenhuma tecla troca de
            ferramenta ou apaga nada por engano a meio da escrita.
            - Todas as ferramentas continuam com botão visível na barra — os atalhos são um
            atalho, nunca a única forma de usar uma ferramenta.
            - A borracha (🧹) fica sem tecla própria de propósito: com seleção pelo rato + Delete
            já a funcionar desde há várias versões, deixou de ser a única forma de apagar.

            Testado (29 verificações reais, Playwright + Electron): as 8 teclas confirmadas a
            ativar a ferramenta certa; tooltips com a letra confirmadas; a frase "TEXTO ZONA
            CURVA RETA SETA OVAL" escrita dentro de uma caixa de texto e também no nome de um
            jogador, confirmando que nenhuma ferramenta mudou nem nada foi apagado em nenhum dos
            dois campos; "?" a abrir o Tutorial confirmado; as 12 ferramentas confirmadas com
            botão visível; sem qualquer interferência com os atalhos de categoria do vídeo (letras
            só reagem com a aba do quadro tático ativa).
