name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.80 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Reorganização da interface do quadro tático — lote C: últimos botões uniformizados**

            Afinação final depois dos três lotes anteriores (v0.8.77-79) — os últimos botões da
            barra de cima que ainda abriam uma lista por baixo (não um popup) passam para o mesmo
            padrão de todos os outros, e a barra deixa de poder voltar a quebrar para duas filas.

            - **"Campo"** (modo do quadro) e **"Número/Iniciais/Nome"** (o que mostrar em cada
            jogador — antes 3 botões sempre visíveis) passam a popup, no mesmo estilo do "+
            Objeto".
            - **"Vídeo" e "Imagem" juntam-se num único botão "Exportar"**, com as duas secções
            dentro (não havia nenhuma opção de qualidade/resolução a preservar — a exportação de
            vídeo nunca teve, a de imagem usa sempre a mesma alta resolução fixa).
            - **"Reproduzir sequência de cenas"** já tinha ido para a faixa de cenas no lote
            anterior — confirmado, não precisou de mudar outra vez.
            - **A barra nunca mais quebra para uma segunda fila.** Se não couber (janela estreita,
            iPad), os botões menos usados (modo de rótulo, Formações, + Imagem, + Jogador, +
            Objeto, por esta ordem) mudam-se sozinhos para um popup "⋯ Mais", e voltam ao lugar
            quando há espaço outra vez — nunca desenhar/mover/campo/exportar, esses ficam sempre à
            vista.

            Todos os popups da barra (eram 8, agora são todos) partilham o mesmo comportamento:
            nunca cortados nem atrás do campo, nunca saem da janela, fecham ao clicar fora/escolher
            uma opção/Esc, só um aberto de cada vez, ícone+nome em cada opção.

            Verificado com testes automatizados reais (Electron + Playwright, 37 cenários): os três
            botões convertidos abrem/fecham/aplicam corretamente; a barra mede-se e confirma-se
            numa só fila a 1440px, 1200px, 1000px (nada precisa de colapsar até aqui) e continua
            numa só fila a 900/800/700px (com itens a mudar-se para "⋯ Mais" e a voltar
            corretamente ao alargar a janela outra vez); um popup já colapsado continua a abrir o
            seu próprio popup aninhado sem problemas; o campo mede uma área bem maior do que antes
            de toda a reorganização; painel de propriedades reconfirmado a aplicar-se de facto ao
            objeto selecionado (com undo a provar que não é só visual); tudo testado também em
            simulação de iPad em retrato.
