name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.63 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Quadro tático: mão livre, curvas, e mais estilos de linha e seta**

            - **Mão livre** — nova ferramenta ✎, desenha seguindo o rato em vez de só ligar dois
            pontos.
            - **Curva** 〜 — arrasta para criar (começa reta), depois dois pontos de controlo
            amarelos ficam disponíveis para a moldares à mão. As alças de redimensionar/rodar
            habituais continuam a funcionar nela também.
            - **Traço-ponto** e **ondulada** juntam-se aos estilos de linha existentes — ondulada
            é a convenção de futebol para "drible", disponível em linhas e setas.
            - **Setas com ambas as pontas, ou sem ponta nenhuma** — novo grupo de botões ao lado
            do estilo de linha, para além da seta simples de sempre.

            Testado (22 verificações reais, Playwright + Electron): mão livre acumula um caminho
            real, não só início/fim; curva confirmada reta ao nascer, dobra-se arrastando os
            pontos de controlo sem mexer nos extremos, desfazer reverte só isso, e redimensionar
            pela caixa genérica continua a funcionar nela; os novos estilos de linha e as novas
            combinações de seta gravados corretamente; setas gravadas antes desta versão (sem os
            novos campos) continuam a mostrar exatamente uma ponta, como sempre mostraram; a
            exportação de vídeo das cenas (MP4) confirmada ponta-a-ponta com ffmpeg real, incluindo
            uma curva na cena exportada.
