name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.61 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Quadro tático: redimensionar e rodar qualquer desenho ou boneco, com alças de
            arrastar**

            Depois de selecionar e apagar (versão anterior), agora dá para pegar e transformar.
            Selecionaste um desenho ou um boneco? Aparecem oito alças à volta — quatro nos cantos,
            quatro no meio dos lados — mais uma alça de rodar. Funciona exactamente na mesma para
            uma linha, uma zona, um texto, uma imagem ou um jogador — a mesma ferramenta para tudo:

            - Os cantos redimensionam livremente (largura e altura independentes); os do meio dos
            lados só mexem numa direção. Mantém Shift enquanto arrastas um canto para preservar a
            proporção original.
            - A alça de rodar roda à volta do centro, com o resto (alças incluídas) a acompanhar.
            - Undo/redo cobre tudo isto também, e agora mantém o objeto selecionado depois de
            desfazer — voltas a tentar sem teres de voltar a clicar nele.

            As alças só aparecem quando tens exactamente um objeto selecionado — transformar vários
            de uma vez fica para uma versão futura.

            Testado (26 verificações reais, Playwright + Electron): redimensionar por cada um dos
            oito tipos de alça, com e sem Shift, num desenho e num boneco; o canto oposto ao que
            arrastas fica sempre fixo; rodar define o ângulo correctamente; desfazer reverte o
            redimensionamento mantendo a seleção; mudar de ferramenta esconde as alças de imediato;
            um desenho gravado antes desta versão (sem o novo campo de rotação) continua a abrir e
            a funcionar sem alterações; a exportação de vídeo das cenas (MP4) confirmada
            ponta-a-ponta com ffmpeg real.
