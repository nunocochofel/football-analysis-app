name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.76 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Diagnóstico do redimensionar pelas alças — investigação continua**

            A v0.8.75 corrigiu uma causa real e confirmada de amplificação ao redimensionar pelas
            alças, mas o sintoma foi reportado como continuando presente. Em vez de continuar a
            teorizar, esta versão acrescenta uma instrumentação real para medir exatamente o que
            está a acontecer, e não uma nova tentativa de correção às cegas.

            - **Ctrl+Alt+R** liga/desliga um modo de diagnóstico. Com o modo ligado, cada arrasto
            de uma alça regista, a cada movimento do rato: o delta do rato em pixels de ecrã, o
            mesmo delta convertido para o espaço do canvas, a dimensão original guardada no início
            do arrasto, a dimensão calculada nesse instante, e a dimensão realmente escrita no
            objeto — tudo impresso na consola (F12) no fim do arrasto.

            Com esta instrumentação, medi (não estimei) o comportamento atual num retângulo fresco,
            no mesmo retângulo depois de selecionar/desselecionar 10 objetos (a suspeita principal
            levantada), e num boneco — em nenhum dos três casos a medição mostrou amplificação: um
            arrasto de 15px produziu uma mudança de 12-14px em cada caso, consistentemente. Também
            confirmado que o mousedown que guarda o estado inicial do arrasto está sempre a
            disparar corretamente, que não há mais do que um handler de mousemove ativo, e que a
            alça continua a ser o elemento mais à frente no seu próprio ponto (não fica tapada por
            um boneco por baixo).

            Sem conseguir reproduzir a amplificação com testes automatizados depois da v0.8.75,
            preciso dos números reais do teu ambiente: liga o diagnóstico (Ctrl+Alt+R), reproduz o
            problema, e envia-me o que aparecer na consola (as linhas que começam por
            "[resizeDebug]").
