name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.54 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **LIVE (experimental): correções depois de um teste real com uma live do YouTube**

            A sessão LIVE já não termina sozinha aos 30-40 segundos — a causa era um
            temporizador demasiado apertado para o ritmo real de arranque de uma fonte HLS
            (YouTube), que nunca chegava a acontecer com RTMP. Corrigido, com uma margem
            generosa (minutos, não segundos) e um sinal mais fiável de que a sessão continua
            a ser vista.

            A app agora também reconecta-se sozinha se a ligação cair a meio de uma sessão
            longa (rede, URL do YouTube a expirar) — e mostra isso no painel LIVE (🔄), para
            nunca ser uma reconexão silenciosa. O yt-dlp deixou de ter de ser instalado à
            mão: a app descarrega-o e atualiza-o sozinha na primeira vez que precisares dele.

            Fica tudo registado em detalhe (heartbeats, segmentos, reconexões, erros) em
            `%APPDATA%\LINHA\logs\live-session.log`, para diagnosticar uma sessão longa sem
            depender de screenshots.

            Continua marcado como experimental — RTMP continua a ser a fonte "a sério".
