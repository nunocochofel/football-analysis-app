name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.57 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **LIVE (experimental): o buffer em disco já sobrevive a uma reconexão**

            A v0.8.56 corrigiu o relógio das marcações; esta versão corrige o próprio vídeo.
            Até agora, uma reconexão automática apagava o buffer em disco e começava outro do
            zero — os segundos/minutos antes da queda deixavam de poder ser exportados como
            clip. Corrigido: uma reconexão automática (nunca um "Ligar" manual novo) reutiliza
            o buffer já existente em vez de o substituir, por isso um clip que atravesse o
            momento da queda continua disponível para exportar depois de reconectar.

            Também novo: a janela do buffer em disco passa a ser configurável (5 min / 30 min /
            sessão completa), com "sessão completa" como valor por omissão para lives do
            YouTube — o caso de uso real é o jogo inteiro, não só os últimos minutos. Medição
            real (não extrapolada do bitrate nominal do yt-dlp): cerca de 1,3 GB para 90 minutos
            a 1080p. RTMP mantém "5 minutos" por omissão, como sempre foi; quem preferir poupar
            disco pode escolher uma janela mais curta em qualquer uma das fontes.

            Testado com uma reconexão real forçada (o processo ffmpeg da ingestão morto a
            meio da sessão): o mesmo segmento anterior à queda continuou a poder ser pedido e
            exportado depois de a app reconectar sozinha.

            Continua marcado como experimental. Ainda não há forma de recuperar uma sessão LIVE
            se a app fechar ou o PC desligar a meio — os fragmentos ficam em disco, mas a app
            não os deteta ainda ao reabrir. E o buffer, por agora, é sempre a mesma janela
            deslizante: ainda não existe um botão para "fechar o jogo" e transformar tudo o que
            foi guardado num ficheiro normal do projeto — é o próximo passo, maior, já planeado.
