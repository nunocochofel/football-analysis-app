name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.90 specifically (corrected) — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Causa real da exportação presa nos 50%, encontrada e corrigida — reproduzida a
            sério, não suposta**

            Instrumentado o caminho inteiro (novo `export.log`, botão 📄 no painel de exportação,
            regista início, cada frame, cada forma, arranque do ffmpeg, cada linha de progresso e
            fim). Com isso reproduziu-se o bloqueio de verdade: quando o fim do corte coincide com
            (ou está muito perto d)o fim real do vídeo fonte, o `<video>` chega ao fim e o Chromium
            pode nunca mais entregar o frame seguinte de captura — a condição interna que termina a
            captura nunca chega a ser avaliada outra vez, e a promessa fica à espera para sempre. O
            log mostrou exatamente isto: o último frame do corte desenhado e codificado com
            sucesso, e a seguir silêncio absoluto — nada mais, nunca. Só afeta clipes com
            desenhos/zoom (o único caminho que usa este mecanismo) — sem eles a exportação lê o
            ficheiro fonte diretamente, nunca passa por aqui.

            - Corrigido a ouvir também o evento nativo `ended` do vídeo, que dispara sempre
            independentemente do próximo frame de captura alguma vez chegar — fecha exatamente a
            falha encontrada.
            - Rede de segurança adicional: um limite de tempo total na captura (duração do corte +
            20s de folga), para qualquer outra causa ainda não vista nunca mais prender a
            exportação para sempre.
            - Corrigido também um bug real na própria barra de progresso: trocava o identificador
            do trabalho pela percentagem, e nunca atualizava a barra do painel durante a
            codificação do ffmpeg — ficava visualmente parada nos 50% mesmo quando tudo corria bem
            por baixo. Agora avança de verdade.

            Verificado reproduzindo o bloqueio de propósito (corte a terminar exactamente no fim do
            vídeo fonte) — confirmado preso antes da correção, confirmado a completar sempre depois
            dela, repetido várias vezes.
