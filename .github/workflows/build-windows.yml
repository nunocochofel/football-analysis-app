name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.82 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Atalho de teclado para a posse de bola, e indicador bem mais visível**

            - Nova tecla **\ (barra invertida)** alterna Time A → Time B → parada → Time A, sem
            tirar as mãos do rato/teclado numérico. Usa o código físico da tecla (não o caráter),
            por isso funciona igual independentemente de estar ou não a usar AltGr. Funciona em
            vídeo gravado e em live tagging; suspensa a escrever em qualquer campo, como todos os
            outros atalhos desta app; os botões no ecrã continuam exatamente iguais.
            - **Indicador corrigido** — antes, o botão da equipa ativa só ficava com texto a
            negrito sobre o MESMO fundo do botão inativo, praticamente impercetível a olhar para o
            vídeo em vez de para a barra. Agora fica preenchido com a cor real da equipa (a mesma
            usada nas Estatísticas), o botão "parar" também se destaca quando é esse o estado
            atual, e há um pisca-pisca breve (350ms) em qualquer mudança — tecla ou clique — a
            confirmar que registou sem precisares de desviar o olhar.
            - Tooltips atualizadas com a tecla, e o Tutorial já lista o atalho.

            Verificado com testes automatizados reais (Electron + Playwright, 14 cenários): as
            três voltas do ciclo funcionam pela tecla e pelo código físico alternativo
            (IntlBackslash); o fundo do botão ativo é mesmo a cor da equipa, não uma cor genérica;
            suspenso a escrever num campo de categoria; os botões no ecrã continuam a funcionar;
            funciona em live tagging; não dispara no separador do quadro tático; e não cria
            nenhuma marcação/categoria por engano.
