name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.71 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Correção urgente: o campo do quadro tático voltava a ficar cortado numa janela mais
            pequena**

            Depois da v0.8.68/v0.8.69 (mais botões na barra de ferramentas: seta poligonal, rótulo
            dos jogadores, exportar imagem), uma janela mais estreita ou mais baixa podia deixar a
            barra de ferramentas maior do que o espaço disponível — cortando as linhas laterais do
            campo em vez de o campo encolher. Investigado antes de mexer em nada: a proporção do
            campo nunca mudou (não é distorção), e as posições gravadas em cenas antigas nunca se
            deslocaram (não é perda de trabalho) — era mesmo só um problema de espaço.

            - O campo agora **nunca corta** — encolhe sempre mantendo a proporção correta, em
            qualquer tamanho de janela.
            - A **faixa de cenas** fica bastante mais pequena (miniaturas menores) e pode ser
            **recolhida por completo** com um botão — fica expandida por omissão, mas mais
            compacta, para dar prioridade ao campo.
            - Janela da aplicação com um tamanho mínimo (1000x650), para nunca ficar tão pequena
            que a própria barra de ferramentas deixe de caber.
            - Corrigido também um problema mais antigo (não introduzido por nenhuma versão
            recente): numa janela estreita, o painel lateral de formações podia ocupar toda a
            altura disponível, sem sobrar nada para o campo.

            Testado (29 verificações reais, Playwright + Electron): campo confirmado a caber
            inteiro e com a proporção correta em janela pequena, janela grande, dimensões de
            tablet em retrato/paisagem, e no layout móvel/tablet real (iPad/PWA); posição de um
            token gravado antes destas alterações confirmada inalterada depois de vários
            redimensionamentos; faixa de cenas confirmada a recolher/expandir e a libertar espaço
            para o campo; os 4 modos do quadro tático (Campo Inteiro, Zonas, Área, Na
            Profundidade) confirmados cada um com a sua proporção correta.
