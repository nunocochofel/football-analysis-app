name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.68 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Quadro tático: seta poligonal (multi-segmento)**

            - Nova ferramenta de seta com várias dobras — clica para cada ponto de dobra,
            duplo-clique termina. Útil para desenhar um movimento que contorna um adversário ou
            muda de direção mais do que uma vez, em vez de várias setas retas separadas.
            - Depois de criada, cada ponto de dobra fica com a sua própria alça — arrasta um
            ponto individual para ajustar só essa parte do movimento, sem mexer no resto.
            - Suporta as mesmas opções que já existiam para as outras linhas/setas: estilo
            (contínua/tracejada/pontilhada/zigzag), espessura, cor, e pontas de seta numa ou nas
            duas extremidades.
            - Funciona como qualquer outra forma do quadro: selecionar, duplicar (Ctrl+D), apagar,
            copiar/colar, bloquear, gravar em cenas e exportar em vídeo.

            Testado (15 verificações reais, Playwright + Electron): criação por cliques sucessivos
            e duplo-clique a terminar; seleção pelo rato; alças de ponto visíveis e funcionais
            (arrastar uma move só esse ponto); desfazer (Ctrl+Z) confirmado; duplicar e apagar
            confirmados; gravada corretamente numa cena e reaberta sem exceções depois de fechar e
            reabrir a aplicação; a exportação de vídeo das cenas (MP4) confirmada ponta-a-ponta
            com ffmpeg real, com uma seta poligonal numa das cenas.
