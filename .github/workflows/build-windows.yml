name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.64 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Quadro tático: elipse, retângulo, triângulo, padrões de preenchimento e
            transparência**

            - **Três formas novas** — elipse ◯, retângulo ▭ e triângulo △, ao lado da zona já
            existente. Clicar em qualquer ponto DENTRO de uma forma preenchida seleciona-a, não
            só o contorno.
            - **Padrão de preenchimento** — sólido, riscas (com ângulo escolhível), pontinhos,
            quadrícula, ou sem preenchimento nenhum (só o contorno). Aplica-se também à zona.
            - **Transparência ajustável** — um slider (0–100%) controla o quão transparente fica
            o preenchimento, em vez do valor fixo de sempre.
            - **Espessura do contorno** — fina/média/grossa, e o contorno de qualquer forma
            preenchida aceita agora os mesmos estilos de linha (tracejado, pontilhado, etc.) que
            já existiam para linhas e setas.

            Testado (23 verificações reais, Playwright + Electron): as três formas novas criadas
            corretamente; clicar no interior de cada uma seleciona-a; opacidade/padrão/ângulo/
            espessura escolhidos na barra gravados corretamente na forma criada a seguir; as
            alças de redimensionar (Fase 3) e apagar (Fase 2) confirmadas a funcionar nas formas
            novas; uma zona gravada antes desta versão (sem os campos novos) continua a abrir,
            selecionável e clicável por dentro exatamente como antes; a exportação de vídeo das
            cenas (MP4) confirmada ponta-a-ponta com ffmpeg real, incluindo as formas novas na
            cena exportada.
