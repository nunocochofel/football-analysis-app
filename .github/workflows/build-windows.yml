name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.75 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Correção urgente: redimensionar pelas alças exagerava (crescia/encolhia muito mais
            do que o gesto do rato)**

            Duas causas, ambas no mesmo mecanismo (as 8 alças de redimensionar, partilhadas por
            formas, texto e bonecos):
            - Formas liam a sua própria posição já alterada pelo movimento de rato ANTERIOR do
            mesmo arrasto, em vez da posição com que o arrasto começou — cada novo movimento do
            rato compunha o erro em cima do anterior.
            - Bonecos multiplicavam o tamanho já atualizado pelo fator do momento atual, em vez do
            tamanho original — o mesmo tipo de erro a compor-se a cada pixel de movimento.

            Corrigido para guardar a geometria/tamanho original UMA VEZ no início do arrasto e
            calcular sempre a partir daí — nunca a partir do que já foi alterado durante o próprio
            gesto. Confirmado também que a roda do rato sobre um boneco (não tinha este bug) e o
            cálculo do ponto fixo oposto à alça arrastada (já estava correto) continuam bem.

            Testado (25 verificações reais, Playwright + Electron): as 8 alças, uma a uma, num
            retângulo — cada uma confirmada a mover-se exatamente 1:1 com o rato (15px de arrasto =
            15px de mudança); a mesma alça testada a crescer e a encolher; boneco confirmado a
            crescer/encolher de forma proporcional ao gesto, não exponencial; roda do rato sobre um
            boneco confirmada sem regressão; gravação de cena e exportação de vídeo (MP4)
            confirmadas sem alterações.
