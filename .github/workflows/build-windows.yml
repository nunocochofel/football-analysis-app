name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.73 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Ronda de estabilização (1/N): seleção previsível + começar a desenhar sobre um
            boneco**

            Sem funcionalidade nova — só correções, depois de várias fases seguidas terem deixado
            a interação do quadro tático inconsistente entre tipos de objeto.

            **Seleção (clique, duplo-clique, botão direito)** — passa a ser exatamente a mesma
            regra para qualquer tipo de objeto (forma, boneco, texto):
            - Clique simples seleciona só o objeto sob o cursor; Shift+clique acrescenta/remove
            só esse, sem tocar no resto — agora também a misturar tipos (ex.: um boneco + uma
            forma ao mesmo tempo).
            - **Duplo-clique num boneco deixava de o selecionar para o APAGAR imediatamente, sem
            confirmação** — o único tipo de objeto do quadro com esse comportamento. Corrigido:
            duplo-clique já não apaga nada; apagar continua disponível por seleção+Delete ou
            botão direito → Apagar.
            - **Botão direito** passa a ter uma regra única: se já havia alguma coisa selecionada,
            nunca lhe mexe (abre o menu para essa seleção tal como estava, mesmo clicando fora
            dela); só escolhe o que está sob o cursor quando a seleção estava vazia. Antes disto,
            clicar com o botão direito num objeto não selecionado destruía sempre uma
            multi-seleção existente — a origem mais provável de "não consigo prever o que fica
            selecionado".

            **Começar a desenhar sobre um boneco** — um boneco é um elemento próprio por cima do
            campo; com uma ferramenta de desenho ativa, um clique que calhasse em cima de um
            boneco não fazia nada (nem selecionava, nem desenhava) em vez de começar a forma ali
            mesmo. Corrigido.

            Testado (19 verificações reais, Playwright + Electron): desenhar uma linha e uma seta
            a começar em cima de um boneco e da sua pega de rodar; clique simples e clique em
            vazio; Shift+clique a misturar um boneco e uma forma; duplo-clique num boneco
            confirmado a NÃO apagar; duplo-clique num texto confirmado a continuar a abrir o
            editor; botão direito com seleção vazia (seleciona) e com seleção prévia (nunca
            muda, testado clicando em vazio e diretamente sobre outro objeto); gravação de cena e
            exportação de vídeo (MP4) confirmadas a continuar a funcionar sem alterações.
