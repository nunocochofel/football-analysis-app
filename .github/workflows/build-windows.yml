name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.79 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Reorganização da interface do quadro tático — lote B/2: painel de edição ao vivo**

            Último lote da reorganização (lote 1 = v0.8.77, lote A = v0.8.78, ambos sem
            funcionalidade nova). Este lote acrescenta o painel de propriedades ao vivo, estilo
            PowerPoint, mais um pedido explícito: o seletor de cor livre para o texto.

            - **Sem nada selecionado**, o painel à direita continua a mostrar e a definir as
            propriedades do PRÓXIMO desenho (exatamente como antes).

            - **Com uma forma selecionada**, os MESMOS controlos passam a ler e a escrever nessa
            forma, aplicando de imediato, sem confirmação: cor de contorno, tipo/espessura de linha,
            pontas de seta, cor/padrão/ângulo/transparência de preenchimento. Cada secção só aparece
            quando faz sentido para o tipo selecionado — uma linha não mostra preenchimento, uma
            curva não mostra tipo de linha (não se aplica), um retângulo não mostra pontas de seta.

            - **Texto** ganha uma secção própria: cor do texto com seletor livre (roda/hex, não só
            a paleta fixa de sempre), tipo de letra, tamanho, negrito/itálico/sublinhado,
            alinhamento, e cor/transparência da caixa de fundo — tudo aplicado de imediato. O
            editor flutuante (duplo-clique) continua a existir para escrever o conteúdo do texto.

            - **Bonecos** ganham tamanho, número, nome e cor editáveis no painel — número e nome só
            aparecem para bonecos de jogador; a cor só aparece quando não vem da escalação (nesse
            caso editá-la aqui não teria efeito, por isso fica oculta em vez de enganar).

            - **Vários selecionados**: o painel mostra as propriedades comuns e aplica a mudança a
            todos de uma vez (um só passo no undo). Seleção mista de formas e bonecos não mostra
            nenhuma secção específica, para nunca aplicar uma propriedade ao tipo errado.

            Verificado com testes automatizados reais (Electron + Playwright, 29 cenários): cada
            tipo de forma mostra só as secções certas; editar ao vivo aplica-se de facto ao objeto
            (com undo a reverter num só passo, mesmo com vários selecionados); número/nome/cor de
            boneco aplicam-se de imediato no campo; o painel cabe e desloca-se corretamente em
            ecrã pequeno e em iPad (gaveta em retrato, coluna fixa em paisagem); um projeto com
            estes campos novos sobrevive a reiniciar a app; atalhos continuam suspensos a escrever
            texto; exportação de vídeo e de imagem continuam presentes.
