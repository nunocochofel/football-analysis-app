name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.66 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Quadro tático: texto com sublinhado, alinhamento, tipo de letra e caixa de fundo**

            - **Sublinhado** e **alinhamento** (esquerda/centro/direita) para qualquer texto do
            quadro tático.
            - **Tipo de letra** — 5 opções (Inter, IBM Plex Mono, Georgia, Courier New, Trebuchet
            MS), além do tamanho que já existia.
            - **Caixa de fundo** — cor e transparência configuráveis, com contorno opcional, para
            o texto continuar legível em cima de qualquer traço ou zona do quadro.

            O vídeo mantém o editor de texto simples de sempre — esta mudança é só no quadro
            tático. Os atalhos de teclado (Delete, Ctrl+D, etc.) ficam sempre suspensos enquanto
            estás a escrever dentro da caixa de texto, para nunca apagar nem duplicar nada por
            engano enquanto escreves.

            Testado (35 verificações reais, Playwright + Electron): sublinhado, alinhamento, tipo
            de letra e caixa de fundo aplicados e gravados corretamente; atalhos da app (Delete/
            Ctrl+D) confirmados suspensos com o foco na caixa de texto; uma forma de texto gravada
            antes desta versão (sem nenhum destes campos) abre com os valores por omissão
            corretos — alinhamento à esquerda, sem sublinhado, sem caixa de fundo — a mesma
            aparência que sempre teve; confirmado igual depois de fechar e reabrir a aplicação; o
            editor de texto do vídeo confirmado a NÃO ganhar nenhum destes campos novos (exclusivos
            do quadro tático); a exportação de vídeo das cenas (MP4) confirmada ponta-a-ponta com
            ffmpeg real, incluindo uma forma de texto desta versão numa das cenas.
