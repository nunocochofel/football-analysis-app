name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.59 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Bastidores: o quadro tático e as anotações de vídeo passam a partilhar um único
            desenhador**

            Sem mudança visível nenhuma. Até agora, o quadro tático e as anotações sobre o vídeo
            tinham cada um a sua própria cópia da lógica que desenha linhas, setas, zonas e
            texto — duas versões que já tinham começado a divergir sem ninguém decidir isso (por
            exemplo, arrastar uma forma já existente só funcionava no vídeo, não no quadro).
            Unificadas num único desenhador partilhado pelos dois.

            É trabalho de preparação: a partir de agora, cada ferramenta nova construída para o
            quadro tático (seleção, mover, redimensionar, undo/redo a sério, etc. — nas próximas
            versões) fica automaticamente disponível para o vídeo também, sem ser preciso
            reescrever nada quando chegar a vez.

            Testado com formas de todos os tipos em ambas as superfícies, e a exportação de
            vídeo das cenas do quadro tático (a que gera o MP4 da sequência) confirmada
            ponta-a-ponta com ffmpeg real — inclui comparar o conteúdo real dos pixels exportados
            com e sem desenhos, não só se o ficheiro foi criado. Projetos existentes abrem
            exatamente iguais.
