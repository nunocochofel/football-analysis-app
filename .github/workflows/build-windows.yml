name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.67 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Quadro tático: rótulo dos jogadores (número/iniciais/nome) e destaque (halo)**

            - **Rótulo dos jogadores** — escolhe mostrar o número (como sempre foi), as iniciais,
            ou o nome completo (numa etiqueta por baixo de cada boneco). Aplica-se a todos os
            jogadores do quadro de uma vez, e fica guardado no projeto.
            - **Destacar (halo)** — um anel de brilho à volta de um boneco, para chamar a atenção
            a um jogador ou objeto durante uma explicação. Liga/desliga pelo menu do botão
            direito do rato, um ou vários de cada vez.
            - Redimensionar bonecos e equipamento de treino (arrastando as alças ou com a roda do
            rato) já funcionava — passa agora a estar mencionado na dica da barra de ferramentas,
            para ser mais fácil de encontrar.

            Testado (22 verificações reais, Playwright + Electron): os três modos de rótulo
            aplicados e gravados corretamente, com a preferência a sobreviver a fechar e reabrir a
            aplicação; um projeto gravado antes desta versão (sem esta preferência gravada) abre
            sem exceções e assume "número", exatamente como sempre mostrou; destacar/remover
            destaque testado num jogador via o menu de contexto, escondido corretamente quando só
            uma forma desenhada (não um boneco) está selecionada; o destaque persiste dentro de
            uma cena gravada e depois de fechar e reabrir a aplicação; a exportação de vídeo das
            cenas (MP4) confirmada ponta-a-ponta com ffmpeg real, com um boneco destacado e em
            modo "nome" numa das cenas.
