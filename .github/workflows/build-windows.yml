name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.87 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Correção: zoom exportado no sítio errado (e desenhos com zoom ativo também)**

            Causa confirmada por teste real, não suposição: o arrastar do zoom era calculado como
            fração da LARGURA DO CONTENTOR do vídeo, que inclui as barras pretas do letterbox
            quando a proporção não bate certo — mas a exportação aplicava essa fração diretamente
            sobre o frame original, sem barras nenhumas. Na pré-visualização não se notava (o CSS
            desloca contentor e vídeo juntos); na exportação o desvio era proporcional à largura das
            barras, exatamente como suspeitado. Os desenhos nunca tiveram este problema em si — já
            usavam a caixa de conteúdo certa — mas quando exportados NUM CLIPE COM ZOOM, ficavam nas
            coordenadas do frame inteiro por cima de um vídeo já recortado pelo zoom; agora recebem
            o mesmo recorte.

            - Corrigido guardando o arrasto do zoom sempre como fração do vídeo real, nunca do
            contentor — confirmado com testes automáticos que ligam zoom aos 4 cantos e ao centro,
            num vídeo 16:9 e noutro 4:3 com barras a sério, comparando o ficheiro exportado
            (não a pré-visualização) a cada vez.
            - Corrigido o mesmo recorte a aplicar-se aos desenhos quando o clipe também tem zoom.
            - Investigada a fundo a trava/salto de frames ao exportar uma régua: desenhar uma régua
            não demora mais do que uma seta (medido: ~1.1-1.3x, dentro do ruído), a contagem de
            frames bate certo e o tempo total de exportação não muda — não foi possível reproduzir
            este segundo problema num teste controlado. Não é a mesma causa do zoom (matemática de
            coordenadas vs. desempenho) — a decorrer mais detalhes do utilizador para isolar.

            Verificado com testes automatizados reais (Electron + Playwright), incluindo comparação
            pixel a pixel do ficheiro exportado contra o esperado.
