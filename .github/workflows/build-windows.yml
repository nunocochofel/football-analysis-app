name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.58 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Dois desenhos que se perdiam sem aviso — corrigidos**

            Primeiro de vários lançamentos a refazer as ferramentas de desenho, começando pelas
            duas falhas que já causavam perda de trabalho hoje, antes de mexer em mais nada:

            1. Anotações livres sobre o vídeo (as que não estão presas a nenhum clip) nunca
            tinham sido gravadas no projeto — desenhavas, fechavas a app ou recarregavas, e
            desapareciam sem nenhum aviso. Passam agora a gravar como tudo o resto.

            2. Se o projeto ficasse grande demais para o espaço disponível (normalmente por
            imagens embutidas), a gravação falhava em silêncio — sem qualquer sinal de que o
            trabalho tinha deixado de estar seguro. Passa a mostrar um aviso claro quando isso
            acontece.

            Projetos existentes abrem exactamente iguais — testado explicitamente reabrindo um
            projeto gravado no formato antigo (sem estas anotações livres) antes de publicar.

            É a base para as fases seguintes, focadas no quadro tático: seleccionar, mover,
            redimensionar e apagar qualquer desenho, undo/redo a sério, e o resto do que foi
            pedido — cada fase publicada e testada separadamente.
