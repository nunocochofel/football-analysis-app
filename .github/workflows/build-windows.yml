name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.65 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Quadro tático: paleta maior, cor livre, recentes/favoritas, e preenchimento com cor
            própria**

            - **Paleta alargada** — 16 cores em vez de 5, mais um seletor de cor livre (roda/hex,
            o do próprio sistema) para qualquer cor exata que precises.
            - **Cores recentes** — as últimas cores usadas ficam à mão, automaticamente.
            **Favoritas** — guarda as tuas cores de sempre com um clique, e ficam disponíveis em
            todos os projetos (não é preciso repetir por projeto).
            - **Contorno e preenchimento com cor independente** — zona, elipse, retângulo e
            triângulo passam a ter dois seletores de cor separados na barra: um para o contorno,
            outro para o preenchimento.

            O vídeo mantém a paleta simples de sempre — esta mudança é só no quadro tático.

            Testado (18 verificações reais, Playwright + Electron): cor escolhida na paleta
            alargada aplicada corretamente; cor livre via o seletor nativo aplicada e guardada
            nas recentes; recentes confirmadas a sobreviver a fechar e reabrir a aplicação
            (preferência da app, não do projeto); guardar e reutilizar uma favorita; contorno e
            preenchimento gravados com cores diferentes quando escolhidas separadamente; uma
            forma gravada antes desta versão (sem cor de preenchimento própria) continua a
            mostrar o preenchimento na mesma cor do contorno, como sempre mostrou; a exportação
            de vídeo das cenas (MP4) confirmada ponta-a-ponta com ffmpeg real.
