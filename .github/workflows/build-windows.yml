name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). Static text describing v0.8.51 specifically — update this block
          # for whatever the next release's own user-facing change actually is, same as every
          # release before this needed its own description written by hand.
          body: |
            **Os teus projetos antigos aparecem sozinhos, mesmo depois de reinstalar**

            Se já tinhas esta app instalada antes de se chamar LINHA, os teus projetos podem
            não ter aparecido ao atualizar — ficavam guardados num sítio associado ao nome
            antigo da app. Agora, a primeira vez que abrires esta versão, os projetos da
            versão antiga são copiados automaticamente (nunca apagados do sítio original).
            Não precisas de fazer nada.
