name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.69 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Quadro tático: exportar como imagem em alta resolução**

            - Novo botão "📷 Exportar imagem" — tira o que o quadro tático mostra agora e grava
            como PNG em alta resolução (2400px no lado maior), em **paisagem** ou **retrato**.
            - Opção de **fundo transparente**: PNG só com as marcações do campo, jogadores e
            desenhos, sem o relvado — para sobrepor a outro fundo (uma apresentação, um vídeo,
            etc.).
            - Acrescenta-se à exportação de vídeo das cenas (MP4/GIF) que já existia — essa
            continua exatamente igual, para a sequência de cenas animada; esta é para uma imagem
            só, direta do que está no ecrã.

            Testado (12 verificações reais, Playwright + Electron): paisagem e retrato exportados
            com a resolução e orientação corretas; fundo transparente confirmado píxel a píxel
            (canto fora do campo com transparência total); exportação de vídeo das cenas (MP4)
            confirmada a continuar a funcionar sem alterações.
