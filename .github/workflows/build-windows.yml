name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.81 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Quadro tático — sem alças de redimensionar em jogadores e objetos**

            Jogadores e objetos (bola, cones, balizas, marcadores, etc.) são pequenos — as 8 alças
            de redimensionar tapavam-nos, com o número do jogador quase invisível por baixo.

            - Selecionar um jogador ou objeto mostra só o contorno discreto de seleção (já
            existia) — sem as 8 alças.
            - A pega de rotação mantém-se, exatamente como já funcionava.
            - O tamanho muda-se agora pelo slider "Tamanho" no painel da direita, ou continua a
            roda do rato sobre o objeto (inalterada). Novo slider "Direção" no painel faz o mesmo
            que arrastar a pega de rotação — útil em touch e para um valor exato.
            - Formas desenhadas, texto e imagens mantêm as 8 alças, sem nenhuma mudança.
            - Seleção, arrastar, Delete e menu de contexto continuam exatamente iguais — de
            caminho, corrigido um efeito secundário exposto por este teste: depois de mexer num
            campo do painel (Tamanho, Direção, Número, Nome), clicar num boneco para o selecionar
            de novo por vezes não devolvia o foco do teclado, e o Delete a seguir não fazia nada
            (ficava "desativado por estar a escrever num campo" mesmo já não estando). Corrigido
            para toda a seleção por clique, formas incluídas.

            **Compatibilidade**: tamanho e rotação continuam exatamente os mesmos campos de sempre
            (scale/angle) — só mudou a forma de os alterar. Cenas e projetos já gravados abrem
            iguais.

            Verificado com testes automatizados reais (Electron + Playwright, 23 cenários):
            jogadores/bola/objetos sem as 8 alças mas com a pega de rotação; formas/texto/imagem
            inalterados; arrastar a pega ou o slider "Direção" fazem o mesmo; roda do rato e slider
            "Tamanho" fazem o mesmo; seleção múltipla aplica a todos; Delete/arrastar/menu de
            contexto confirmados a funcionar depois de usar os campos do painel; tamanho/rotação
            sobrevivem a gravar cena + reiniciar a app; painel alcançável e funcional em iPad.
