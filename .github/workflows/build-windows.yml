name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.88 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Correção urgente: popups escondidos atrás do vídeo, e posse de bola volta a estar
            sempre visível**

            - **"Desenhar" e "LIVE" apareciam por trás do vídeo, inutilizáveis.** Mesma causa do
            "+ Objeto" já corrigido no quadro tático: usavam um popup `position:absolute`, que fica
            sujeito ao `overflow:hidden` de qualquer antepassado — neste caso o mecanismo "⋯ Mais"
            da barra do vídeo, introduzido na correção do layout. Convertidos para o mesmo popup
            `position:fixed` (com posição calculada em JS) já usado no resto da app: nunca mais
            fica escondido, nunca sai da janela, fecha ao clicar fora ou com Esc.
            - **Posse de bola volta a ter os três botões sempre visíveis na barra** (Time A / Time
            B / parada) — tinham passado a popup na correção do layout anterior, mas a posse
            muda-se em tempo real a olhar para o jogo, e abrir um popup para isso tornava-se lento.
            O botão ativo continua preenchido com a cor da equipa, para ver de relance.

            Regra para o futuro: só o que se usa ocasionalmente vai a popup — o que se usa em tempo
            real durante o jogo (posse, categorias, controlos de reprodução) fica sempre visível.

            Verificado com testes automatizados reais (Electron + Playwright): os dois popups
            confirmados visualmente por cima do vídeo (não só presentes no HTML) e interativos,
            fecho por Esc e por clique fora, e a posse a ativar num único clique sem popup.
