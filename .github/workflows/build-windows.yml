name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.89 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Correção urgente: exportação nunca mais fica presa a meio quando o clipe tem
            desenhos**

            Testados os 7 tipos de desenho (linha, seta, zona, holofote, vinheta, régua, texto),
            vários ao mesmo tempo e zoom+desenhos juntos, sempre em exportações reais (não só a
            barra de progresso) — nenhum ficou preso nestes testes. Mesmo assim, adicionadas três
            proteções para o caso de acontecer com filmagem real ou uma combinação não testada:

            - **Cada forma desenha-se dentro do seu próprio try/catch** — uma forma com dados
            inválidos é ignorada (registada) em vez de arriscar todo o clipe. Corrigido também um
            desequilíbrio de save/restore do canvas que uma forma partida a meio podia deixar,
            capaz de corromper o desenho de todas as formas seguintes no mesmo clipe.
            - **Cada frame tem um limite de 8 segundos** para desenhar e codificar — se nunca
            resolver (ex.: um bug raro do próprio Chromium em que `canvas.toBlob()` não chama o
            callback), esse frame é substituído pelo anterior e a exportação continua, em vez de
            ficar presa para sempre à espera dele.
            - **Aviso no fim** se alguma forma ou frame tiver falhado — "Exportado com avisos" — em
            vez de silêncio ou uma exportação que nunca termina.

            Verificado com testes automatizados reais (Electron + Playwright) exportando os 7
            tipos de desenho, vários juntos, e zoom+desenhos — todos completos sem travar.
