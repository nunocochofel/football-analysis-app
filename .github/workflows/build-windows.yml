name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.83 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Tecla da posse de bola agora é configurável (a tecla fixa "\" não funcionava em todos os teclados)**

            A v0.8.82 fixava a tecla `\`, mas o código físico que essa tecla envia varia por
            teclado/driver do Windows — não havia como acertar uma tecla fixa que funcionasse para
            todos. Em vez de tentar adivinhar outra, a tecla passa a ser escolhida por ti.

            - Em "Times & categorias" → "Editar categorias", novo botão **"🎹 Premir tecla…"**:
            clicas, primes a tecla que queres, e a app regista exatamente o que o teu teclado
            enviou — nome legível mostrado logo a seguir, para confirmares que é a certa.
            - Em branco por omissão — nenhuma tecla atribuída até definires uma; nunca arrisca
            colidir sozinha com uma categoria tua.
            - Avisa na hora se a tecla já está a ser usada por Espaço, ←/→, Esc, ou por uma
            categoria — não bloqueia (podes decidir na mesma), mas nunca fica em silêncio.
            - Configurável por projeto, e também como predefinição para projetos novos (no ecrã
            inicial, junto às categorias predefinidas) — igual ao que já existia para categorias.
            - Indicador de posse continua preenchido com a cor real da equipa (herdado da versão
            anterior) — tooltips e Tutorial atualizados para refletirem a tecla configurada em vez
            de um atalho fixo.

            Verificado com testes automatizados reais (Electron + Playwright, 25 cenários): captura
            regista o código correto e mostra o nome legível; Esc cancela sem alterar o que já
            estava definido; aviso aparece para Espaço e para uma categoria existente; a tecla
            escolhida cicla mesmo os três estados; um projeto novo herda a predefinição, um projeto
            já existente NUNCA é alterado por uma predefinição mudada depois; suspenso a escrever
            num campo; funciona em live tagging; não dispara no quadro tático; botões no ecrã
            continuam a funcionar.
