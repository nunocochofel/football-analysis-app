name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.78 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Reorganização da interface do quadro tático — lote A/2: barra numa fila, popups completos**

            Segundo lote da reorganização (o primeiro foi a v0.8.77, popup "+ Objeto" + ferramentas
            de desenho). Sem funcionalidade nova — só reorganizar o que já existia.

            - **Barra de cima limpa** — cor, tipo/espessura de linha, pontas de seta, e
            padrão/transparência de preenchimento saíram da barra para o painel à direita (mesmo
            comportamento de sempre: definem o que se aplica ao próximo desenho). O texto de ajuda
            comprido que estava por baixo da barra e no painel da direita passou para o Tutorial.
            Com isto, e com rótulos mais curtos em alguns botões, a barra cabe numa só fila.

            - **"+ Jogador" já não fica cortado** — mesma correção do "+ Objeto" no lote anterior.

            - **Formações num popup próprio** — Time A e Time B, no mesmo popup, no mesmo estilo
            visual dos outros. Deixam de estar sempre visíveis no painel da direita, que agora está
            livre para os controlos de estilo.

            - **O campo cresce** — com a barra numa só fila e o painel da direita mais compacto, o
            campo ocupa bastante mais espaço. Continua a aparecer sempre inteiro, encolhendo com a
            faixa toda visível em qualquer tamanho de janela.

            O botão "Reproduzir sequência de cenas" mudou-se para a faixa de cenas por baixo do
            campo (onde já vivem o contador e o botão de gravar cena) — é onde faz mais sentido, e
            ajudou a barra a caber numa fila.

            Verificado com testes automatizados reais (Electron + Playwright): painel de estilo
            relocalizado continua a definir o que se desenha a seguir; os três popups (+Jogador,
            Formações, seletor de cor) nunca saem da janela, em ecrã pequeno, iPad em retrato e
            paisagem (incluindo a gaveta do painel em retrato e a coluna fixa em paisagem); projeto
            e cena gravados nesta versão sobrevivem a reiniciar a app; atalhos continuam suspensos
            a escrever texto; exportação de vídeo e de imagem continuam presentes.
