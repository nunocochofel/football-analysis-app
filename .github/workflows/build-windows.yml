name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.84 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Correção: arrastar formas no quadro tático — não funcionava para (quase) nenhum tipo**

            Diagnóstico confirmado por leitura direta do código, não suposição: o mousedown sobre
            uma forma selecionada só começava uma sessão de arrasto quando `type==='text'` — todos
            os outros tipos (linha, seta, seta poligonal, curva, mão livre, zona, retângulo, elipse,
            triângulo) ficavam só selecionados e nunca se moviam ao arrastar o corpo. Não era um
            conflito de handlers com as alças ou o desenhar — era esta condição a restringir a um
            único tipo. Corrigido generalizando para qualquer tipo, reaproveitando a mesma
            `applyShapeGeometry`/`cloneShapeGeometry` que o vídeo já usava (nenhuma implementação
            nova a divergir) — geometria original capturada uma vez no mousedown, nunca relida do
            frame anterior, a mesma regra que corrigiu o exagero das 8 alças.

            - Arrastar de dentro de qualquer forma move-a; nas de vários pontos (zona, seta
            poligonal, curva), arrastar de dentro move a forma inteira, arrastar um ponto move só
            esse ponto — zona ganhou pegas de ponto individual, que nunca tinha tido.
            - Com vários objetos selecionados, arrastar um move todos juntos, num só passo de undo.
            Corrigido de caminho: um clique simples (sem arrastar) num item já multi-selecionado
            continua a colapsar para só esse, exatamente como já acontecia — só decide isso ao
            soltar o rato, não mais cedo, para não destruir o grupo antes de um arrasto ter hipótese
            de mover o conjunto inteiro.
            - Redimensionar pelas alças e rodar continuam exatamente iguais.

            Verificado com testes automatizados reais (Electron + Playwright, 23 cenários): as 10
            formas confirmadas a mover 1:1 com o cursor; zona com arrasto do corpo e de um ponto
            individual, os dois corretos; seleção múltipla confirmada por pixel a mover-se toda
            junta e a desfazer num só passo; clique simples continua a colapsar a seleção como
            antes; redimensionar e rodar reconfirmados a funcionar depois da correção.
