name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.72 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Correção urgente: etiquetas de nome dos jogadores a acumular no quadro tático**

            No modo "nome" (Fase 9, v0.8.67), clicar num jogador, redimensioná-lo (alça ou roda do
            rato) ou movê-lo deixava a etiqueta com o nome anterior no campo em vez de a substituir
            — cada interação acrescentava mais uma, sem nunca remover as antigas. Com uso
            repetido, o campo enchia-se de etiquetas fantasma sobrepostas, sem acompanhar os
            bonecos.

            Causa: a etiqueta de nome é um elemento à parte (não faz parte do boneco em si), e a
            função que redesenha os bonecos a cada interação limpava os bonecos antigos mas nunca
            as etiquetas. Corrigido para limpar sempre as duas coisas.

            **As etiquetas fantasma nunca ficaram gravadas nos projetos nem nas cenas** — são
            sempre recalculadas no ecrã a partir do nome atual do jogador, nunca guardadas como
            dado próprio. Não há nada para limpar nem recuperar: fechar e reabrir a aplicação (ou
            simplesmente mudar de separador e voltar) já fazia o campo mostrar-se corretamente,
            mesmo antes desta correção. Cenas gravadas enquanto o bug estava presente abrem sem
            qualquer contaminação.

            Testado (17 verificações reais, Playwright + Electron): 30 cliques seguidos no mesmo
            jogador, cliques em todos os jogadores de seguida, 15 ciclos de redimensionar com a
            roda do rato, arrastar a alça de redimensionar, e mover o jogador 5 vezes — em nenhum
            caso a contagem de etiquetas no ecrã ultrapassou o número real de jogadores; uma cena
            gravada com o bug presente confirmada a abrir sem contaminação depois de fechar e
            reabrir a aplicação; confirmado que o mesmo tipo de acumulação não existe nas alças de
            ponto da seta poligonal nem nas miniaturas de cena.
