name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.53 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Categorias: predefinições para projetos novos**

            As tuas categorias (cor, tecla, tudo) podem tornar-se o ponto de partida de
            qualquer projeto criado a seguir — gere-as na página inicial, onde crias um
            projeto novo: edita-as diretamente, repõe as de fábrica, ou exporta/importa como
            ficheiro (útil para levar as tuas categorias de um computador para outro). Um
            projeto, uma vez criado, é sempre dono das suas próprias categorias — nada feito
            na página inicial volta a alterar um projeto já existente. Também dá para
            exportar as categorias de dentro de um projeto específico (⚙ Times & categorias →
            Categorias), caso as tenhas editado só ali e queiras usá-las noutro projeto novo.

            **Vês dois ícones "LINHA" depois de atualizar? Lê isto.**

            Um erro de packaging entre v0.8.47 e v0.8.52 mudou a identidade interna da app
            (o `appId`), o que fez o instalador tratá-la como uma aplicação nova em vez de
            atualizar a existente. Esta versão corrige isso: o `appId` volta ao original em
            ambas as plataformas.

            - **Se nunca instalaste nenhuma versão entre a v0.8.47 e a v0.8.52:** esta
              atualização é normal, um ícone só, sem nada a fazer.
            - **Se já instalaste alguma versão nesse intervalo:** vais ficar temporariamente
              com dois ícones "LINHA" — a tua instalação original (agora atualizada, com os
              teus dados) e a que ficou vazia desse intervalo (GUID diferente, esta
              atualização não lhe mexe). Como têm o mesmo nome, para os distinguir: **abre
              cada um** — o que já mostra os teus projetos é o correto; o outro, vazio, pode
              ser desinstalado em segurança (Definições → Aplicações) sem qualquer risco para
              os teus dados, que vivem numa pasta completamente separada da instalação em si.
            - **macOS:** mesma lógica — se a app não se atualizar sozinha, descarrega o
              `.dmg` desta versão e arrasta para "Applications", substituindo a anterior. Os
              teus dados (pasta LINHA em Application Support) não são afetados de nenhuma
              forma, venha a atualização automaticamente ou por reinstalação manual.

            Se já tinhas esta app instalada antes de se chamar LINHA (qualquer versão antes
            da v0.8.47), a primeira vez que abrires esta versão os teus projetos antigos são
            copiados automaticamente — não precisas de fazer nada.
