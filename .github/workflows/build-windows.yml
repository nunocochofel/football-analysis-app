name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.60 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Quadro tático: selecionar, apagar e desfazer, finalmente a sério**

            É a maior mudança de sempre nas ferramentas de desenho, e a base para tudo o que vem
            a seguir. Antes de hoje, um desenho no quadro tático não era um objeto — não havia
            como o selecionar, e apagar era só a borracha ou limpar tudo. Isso muda agora:

            - Clicar em qualquer desenho ou boneco seleciona-o (contorno azul a indicar). Shift+clique
            acrescenta à seleção; arrastar sobre uma área vazia seleciona tudo o que apanhar.
            - Apagar funciona por três caminhos, todos com o rato: selecionar e premir Delete,
            clicar com o botão direito → Apagar, ou o novo botão 🗑 na barra de ferramentas.
            - Desfazer/Refazer a sério (Ctrl+Z / Ctrl+Shift+Z, ou os novos botões ↶/↷), cobrindo
            tudo — desenhar, mover, rodar, redimensionar, apagar, trocar de formação. Cada modo de
            quadro (Campo Inteiro, Zonas, Área, Profundidade) tem o seu próprio histórico.
            - Escrever numa caixa de texto nunca mais mexe no quadro por trás — Delete e Ctrl+Z
            ficam desligados do quadro enquanto estiveres a editar texto.

            Testado (41 verificações reais, Playwright + Electron): seleção simples, em grupo e por
            área; apagar pelos três caminhos, sozinho e em grupo (um só Ctrl+Z desfaz o grupo
            inteiro); histórico independente por modo de quadro; escrever texto sem interferir no
            quadro; uma cena gravada antes desta versão continua a abrir e a funcionar na mesma
            (sem reescrever nada no disco só por abrir); a exportação de vídeo das cenas (MP4)
            validada ponta-a-ponta com ffmpeg real.
