name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.55 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **LIVE (experimental): a live do YouTube agora chega mesmo a ter imagem**

            v0.8.54 corrigiu a sessão a morrer sozinha aos 30-40 segundos, mas um teste real
            logo a seguir mostrou que ficava LIVE sem nunca carregar um único segmento.
            Causa, confirmada correndo o ffmpeg à mão contra os URLs reais: o YouTube LIVE
            nunca oferece um formato só com vídeo+áudio já juntos — a app pedia um formato
            desses na mesma, e ficava com um URL só de vídeo, sem áudio, à espera de uma
            faixa que nunca ia chegar. Corrigido: pede vídeo e áudio como duas fontes
            separadas e junta-as. Uma segunda causa, também confirmada à mão: um dos flags
            de reconexão adicionados em v0.8.54 (`-reconnect_at_eof`) fazia o ffmpeg tratar o
            comportamento normal de uma live (reler a playlist à procura de segmentos novos)
            como uma queda de ligação, preso num ciclo a reler sempre o mesmo troço antigo.
            Removido — os restantes flags de reconexão continuam.

            Testado de ponta a ponta contra uma live real e pública do YouTube (não simulada):
            liga, mantém-se LIVE, marca e exporta um corte com sucesso.

            O log detalhado (heartbeats, segmentos, reconexões, todo o stderr do ffmpeg, não
            só as linhas relevantes) fica em
            `%APPDATA%\football-analysis-app\logs\live-session.log` — não em `LINHA`, como
            uma nota anterior indicava incorretamente.

            Continua marcado como experimental — RTMP continua a ser a fonte "a sério".
