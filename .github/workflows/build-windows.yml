name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.77 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **Reorganização da interface do quadro tático — lote 1/3: popups**

            Primeiro lote da reorganização pedida depois da ronda de estabilização, focado só em
            dois pontos reportados como quebrados ou confusos — sem nenhuma funcionalidade nova.

            - **Popup "+ Objeto" cortado** — corrigido. O popup usava o mesmo mecanismo dos outros
            menus do quadro tático (position:absolute), que ficava cortado pelo scroll vertical do
            próprio painel de ferramentas (introduzido na correção urgente do campo cortado, ronda
            anterior) — nenhum z-index escapa ao overflow de um elemento pai. Criado um mecanismo
            novo (position:fixed, com a posição calculada para nunca sair da janela em nenhum
            lado), usado já também no ponto seguinte. Fecha ao clicar fora ou com Esc.

            - **Ferramentas de desenho em popup** — as duas filas densas de ícones (linha, seta,
            seta poligonal, mão livre, curva, zona, elipse, retângulo, triângulo, texto) passam
            para um único botão "Desenhar" que abre um popup com ícone + nome por ferramenta, no
            mesmo estilo visual do "+ Objeto". O botão mostra sempre a ferramenta atualmente ativa.
            "Mover" e a borracha continuam como botões próprios na barra. Todos os atalhos de
            teclado (R, S, V, L, C, Z, O, T, etc.) continuam a funcionar exatamente como antes, e
            fixar uma ferramenta com duplo-clique (para desenhar várias formas seguidas sem reabrir
            o popup) também continua a funcionar de dentro do popup.

            Verificado com testes automatizados reais (Electron + Playwright, cliques e arrastos
            verdadeiros): os dois popups nunca saem da janela em ecrã pequeno, maximizado, e
            simulação de iPad em retrato e paisagem; escolher uma ferramenta no popup desenha
            mesmo uma forma no campo; os atalhos de teclado continuam suspensos a escrever texto;
            a exportação de vídeo e de imagem continuam presentes e por tocar.
