name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). Static text describing v0.8.50 specifically — update this block
          # for whatever the next release's own user-facing change actually is, same as every
          # release before this needed its own description written by hand.
          body: |
            **Categorias: exportar as de um projeto para usar noutro**

            Editaste categorias só dentro de um projeto e querias usá-las como ponto de
            partida de um projeto novo? Em "⚙ Times & categorias" → "Categorias" há agora um
            botão "Exportar categorias deste projeto" — gera um ficheiro que depois importas
            na página inicial (botão "⬆ Importar" da lista de categorias predefinidas). O
            projeto de onde exportaste nunca é alterado por isto.
