name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. See build-mac.yml for why: electron-builder's built-in GitHub
      # publisher has a real, reproduced bug where multiple artifacts race to create the release
      # for a brand-new tag and only one ever wins, instead of falling back to the existing one.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          # User-facing per-release description — softprops/action-gh-release leaves the body
          # empty by default (no generate_release_notes here), and this project has no other
          # per-release-notes mechanism for Windows yet (see build-mac.yml's NOTES_FILE step for
          # the equivalent there). This is the release body shown to everyone regardless of
          # platform — build-mac.yml's own release step never overwrites it (gh release create
          # fails once this one already exists, so it falls through to gh release upload
          # --clobber, which only replaces assets, never the body). Static text describing
          # v0.8.56 specifically — update this block for whatever the next release's own
          # user-facing change actually is, same as every release before this needed its own
          # description written by hand.
          body: |
            **LIVE (experimental): as marcações já não perdem a posição numa reconexão**

            Até agora, se a sessão LIVE reconectasse sozinha a meio de um jogo, o relógio
            interno voltava a 00:00 — uma marcação feita aos 42 minutos podia passar a
            parecer estar no minuto 2. Corrigido: existe agora um relógio de sessão contínuo,
            que começa no "Ligar" e nunca é reiniciado por uma reconexão. Cada marcação
            guarda a sua posição nesse relógio, não no tempo interno do leitor de vídeo (que
            esse sim reinicia a cada reconexão). A faixa de marcações mostra também, como um
            traço a tracejado, exatamente onde e quanto tempo se perdeu em cada queda — para
            nunca confundires um corte de antes de uma reconexão com um de depois.

            Testado com uma reconexão real forçada durante uma live real do YouTube: a
            marcação feita depois da reconexão ficou 18 segundos à frente da anterior — nunca
            voltou a zero.

            Continua marcado como experimental — RTMP continua a ser a fonte "a sério". O
            buffer de vídeo em disco ainda é limpo em cada reconexão (só o relógio e as
            marcações sobrevivem por agora) — é o próximo passo, maior, já planeado.
