name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm run build
      # Fase macOS — distribuição gratuita, sem Apple Developer: package.json's mac.identity é
      # "-" (assinatura ad-hoc, local, gerada na hora pelo próprio codesign do macOS) — NÃO
      # precisa de nenhum certificado, conta ou secret da Apple. Sem notarização (exigiria conta
      # Apple Developer paga): o utilizador vê o aviso normal "developer não identificado" na
      # primeira execução e autoriza pelo mecanismo do próprio macOS (Definições → Privacidade e
      # Segurança → "Abrir mesmo assim") — documentado em docs/INSTALL-MAC.md.
      - run: npx electron-builder --mac --publish never
      # .dmg/.zip sempre disponíveis como artifact do run, independentemente de o passo de
      # publicação do Release (mais abaixo) passar ou falhar — nunca perder a build por causa
      # disso.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-dist-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/latest-mac.yml
          retention-days: 14
          if-no-files-found: ignore
      # Smoke test no próprio runner macOS: o crash reportado acontece durante o bootstrap do
      # Node/Electron, antes de qualquer janela abrir — por isso é detetável mesmo sem sessão
      # gráfica completa no runner.
      #
      # `set +e` logo a seguir é a correção do bug real da ronda anterior: os passos `run:` do
      # GitHub Actions correm com `bash -e` por omissão. `wait "$APP_PID"` devolve o código de
      # saída do processo filho — se a app rebentar (ex. SIGTRAP, código 133), `-e` interrompe o
      # script NESSE PONTO EXATO, e todo o diagnóstico que vinha a seguir (stdout/stderr/crash
      # reports) nunca chegava a correr. `continue-on-error: true` mascarava isto como "success"
      # ao nível do job — exatamente o motivo de o artifact anterior ter ficado quase vazio (274
      # bytes). Sem continue-on-error agora: o passo termina sempre com `exit 0` explícito no
      # fim, de forma honesta (o diagnóstico em si é o objetivo, não o código de saída da app).
      - name: Smoke test — arrancar a app no runner e capturar diagnóstico
        run: |
          set +e
          APP_PATH=$(find dist -maxdepth 2 -iname "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Nenhum .app encontrado em dist/ — build do electron-builder não produziu nada."
            echo "N/A (sem .app)" > smoke-exit-code.txt
            : > smoke-stdout.log
            : > smoke-stderr.log
            : > smoke-diagnostics.log
          else
            EXEC_PATH=$(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f | head -1)
            echo "EXEC_PATH=$EXEC_PATH"

            {
              echo "===== codesign -dvvv ====="
              codesign -dvvv "$APP_PATH" 2>&1
              echo "===== codesign -vvv --strict ====="
              codesign -vvv --strict "$APP_PATH" 2>&1
              echo "===== lipo -archs (executável principal) ====="
              lipo -archs "$EXEC_PATH" 2>&1
              echo "===== ElectronAsarIntegrity (Info.plist) ====="
              /usr/libexec/PlistBuddy -c "Print :ElectronAsarIntegrity" "$APP_PATH/Contents/Info.plist" 2>&1
            } > smoke-diagnostics.log 2>&1

            # timeout(1) não existe por omissão no BSD userland do macOS — implementado com bash
            # puro (background + watchdog) em vez de assumir coreutils/gtimeout instalado.
            ELECTRON_ENABLE_LOGGING=1 "$EXEC_PATH" > smoke-stdout.log 2> smoke-stderr.log &
            APP_PID=$!
            ( sleep 25 && kill -9 "$APP_PID" 2>/dev/null ) &
            WATCHDOG_PID=$!
            wait "$APP_PID"
            EXIT_CODE=$?
            kill "$WATCHDOG_PID" 2>/dev/null
            echo "$EXIT_CODE" > smoke-exit-code.txt

            # Um crash SIGTRAP gera um .ips, mas o macOS pode demorar a escrevê-lo em disco.
            sleep 10
            mkdir -p crash-reports
            cp ~/Library/Logs/DiagnosticReports/*.ips crash-reports/ 2>/dev/null
          fi

          {
            echo "EXIT CODE: $(cat smoke-exit-code.txt 2>/dev/null || echo 'desconhecido')"
            echo ""
            echo "--- DIAGNOSTICO (codesign / lipo / ElectronAsarIntegrity) ---"
            cat smoke-diagnostics.log 2>/dev/null
            echo ""
            echo "--- STDOUT ---"
            cat smoke-stdout.log 2>/dev/null
            echo ""
            echo "--- STDERR ---"
            cat smoke-stderr.log 2>/dev/null
            echo ""
            echo "--- CRASH REPORTS (~/Library/Logs/DiagnosticReports) ---"
            ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || echo "(diretório inexistente ou vazio)"
            for f in crash-reports/*.ips; do
              [ -f "$f" ] || continue
              echo ""
              echo "=== $f ==="
              head -150 "$f"
            done
          } | tee smoke-full-report.txt

          # Visibilidade a) — o relatório completo já ficou no log deste próprio passo, acima
          # (via tee), legível sem autenticação na página pública do run se o repositório for
          # público, e sempre legível por quem tem acesso ao Actions.

          # Visibilidade b) — resumo do run (GitHub Actions → aba "Summary" dessa execução).
          {
            echo "## Smoke test macOS — ${{ github.ref_name }} (${{ github.sha }})"
            echo '```'
            cat smoke-full-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0
      # Controlos A/B (contexto) seguidos de candidatos a correção C1-C5, testados por ordem, com
      # o próprio smoke test como critério de aceitação: para no primeiro que arrancar (exit 0) e
      # publica-o automaticamente. Restrito a workflow_dispatch — nunca corre num push de tag, para
      # não repetir toda a ronda de candidatos (cara, ~15 min) num run disparado pela própria tag
      # que este passo cria quando encontra um vencedor; ver a salvaguarda irmã no passo "Publicar
      # release" mais abaixo (salta se o release já tiver assets, em vez de sobrescrever com um
      # rebuild redundante desse run retriggado).
      - name: Controlos A/B + candidatos de correção (C1-C5) + publicação automática
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          APP_PATH=$(find dist -maxdepth 2 -iname "*.app" -type d | head -1)
          EXEC_PATH=$(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f | head -1)
          echo "APP_PATH=$APP_PATH"
          echo "EXEC_PATH=$EXEC_PATH"

          run_with_timeout () {
            # $1 = segundos, $2 = descrição para o log, resto = comando
            # Deixa o exit code em LAST_EXIT_CODE (variável global, sem "local") para quem chamou
            # poder ramificar a lógica a seguir — usado pelos veredictos A2/bisseção mais abaixo.
            local secs="$1"; local desc="$2"; shift 2
            echo "----- $desc -----"
            echo "comando: $*"
            "$@" > /tmp/_out.log 2> /tmp/_err.log &
            local pid=$!
            ( sleep "$secs" && kill -9 "$pid" 2>/dev/null ) &
            local watchdog=$!
            wait "$pid"
            local code=$?
            kill "$watchdog" 2>/dev/null
            echo "exit code: $code"
            echo "stdout:"; cat /tmp/_out.log
            echo "stderr:"; cat /tmp/_err.log
            echo ""
            LAST_EXIT_CODE="$code"
          }

          {
            echo "===================================================="
            echo "CONTROLO A1 — só o bootstrap do Node do próprio Electron, sem Chromium/GUI"
            echo "===================================================="
            run_with_timeout 15 "ELECTRON_RUN_AS_NODE=1, imprime process.versions" \
              env ELECTRON_RUN_AS_NODE=1 "$EXEC_PATH" -e "console.log(process.versions)"

            echo "===================================================="
            echo "CONTROLO A2 — Electron 43.4.0 virgem, app hello-world mínima (mesmo runner, mesmas flags)"
            echo "===================================================="
            # App real com app.whenReady()+BrowserWindow, não "electron --version" nem "electron
            # sem argumentos" (só mostra o ecrã de ajuda, nunca chega a criar BrowserWindow nem a
            # inicializar o processo de renderer — pouco informativo, foi o que a ronda anterior
            # tinha). app.quit() 1s depois de confirmar a janela dá um exit 0 limpo no caso de
            # sucesso, para distinguir de forma inequívoca de um crash (133) sem ambiguidade com o
            # nosso próprio watchdog (que mataria com 137 se a app ficasse aberta indefinidamente).
            # printf em vez de heredoc: um heredoc com terminador na coluna 0 quebraria o parsing
            # YAML deste bloco literal (run: |), que exige todo o conteúdo indentado ao nível da
            # primeira linha do bloco.
            HELLO_DIR="$RUNNER_TEMP/hello-electron"
            mkdir -p "$HELLO_DIR"
            printf '%s\n' '{ "name": "hello-electron", "version": "1.0.0", "private": true, "main": "main.js" }' > "$HELLO_DIR/package.json"
            printf '%s\n' \
              "const { app, BrowserWindow } = require('electron')" \
              "app.whenReady().then(() => {" \
              "  new BrowserWindow({ width: 400, height: 300, show: false })" \
              "  console.log('CONTROLO_A2_HELLO: BrowserWindow created OK')" \
              "  setTimeout(() => app.quit(), 1000)" \
              "})" \
              > "$HELLO_DIR/main.js"
            echo "----- a instalar electron@43.4.0 virgem em $HELLO_DIR -----"
            ( cd "$HELLO_DIR" && npm install --no-save --no-audit --no-fund electron@43.4.0 ) > /tmp/hello-install.log 2>&1
            echo "npm install exit: $?"
            tail -20 /tmp/hello-install.log
            HELLO_ELECTRON_BIN="$HELLO_DIR/node_modules/.bin/electron"
            HELLO_ELECTRON_REAL_BIN=""
            if [ -x "$HELLO_ELECTRON_BIN" ]; then
              # node_modules/.bin/electron é o shim JS (cli.js) que resolve e invoca o binário
              # nativo — require('electron') a partir do mesmo diretório devolve o caminho real,
              # que é o que o lldb precisa mais abaixo (não consegue depurar um script JS).
              HELLO_ELECTRON_REAL_BIN=$(cd "$HELLO_DIR" && node -e "console.log(require('electron'))" 2>/dev/null)
            fi
            echo "HELLO_ELECTRON_BIN=$HELLO_ELECTRON_BIN"
            echo "HELLO_ELECTRON_REAL_BIN=$HELLO_ELECTRON_REAL_BIN"

            A2_HELLO_EXIT="sem-instalacao"
            if [ -x "$HELLO_ELECTRON_BIN" ]; then
              run_with_timeout 25 "Electron 43.4.0 virgem + hello-world BrowserWindow (--no-sandbox --disable-gpu)" \
                env ELECTRON_ENABLE_LOGGING=1 "$HELLO_ELECTRON_BIN" "$HELLO_DIR" --no-sandbox --disable-gpu
              A2_HELLO_EXIT="$LAST_EXIT_CODE"
            fi

            if [ "$A2_HELLO_EXIT" = "133" ]; then
              A2_VERDICT="ELECTRON_OU_AMBIENTE"
            elif [ "$A2_HELLO_EXIT" = "0" ]; then
              A2_VERDICT="APP_ESPECIFICO"
            else
              A2_VERDICT="INCONCLUSIVO (exit=$A2_HELLO_EXIT)"
            fi
            echo ""
            echo ">>> CONTROLO A2 VEREDICTO: hello-world exit=$A2_HELLO_EXIT -> $A2_VERDICT <<<"
            echo ""

            echo "===================================================="
            echo "CONTROLO A3 — a nossa app com flags que costumam ajudar Chromium sem sessão gráfica"
            echo "===================================================="
            run_with_timeout 15 "--no-sandbox" \
              env ELECTRON_ENABLE_LOGGING=1 "$EXEC_PATH" --no-sandbox
            run_with_timeout 15 "--disable-gpu" \
              env ELECTRON_ENABLE_LOGGING=1 "$EXEC_PATH" --disable-gpu
            run_with_timeout 15 "--no-sandbox --disable-gpu --disable-software-rasterizer" \
              env ELECTRON_ENABLE_LOGGING=1 "$EXEC_PATH" --no-sandbox --disable-gpu --disable-software-rasterizer

            echo "===================================================="
            echo "CONTROLO B — backtrace nativo via lldb"
            echo "===================================================="
            echo "----- lldb na app real -----"
            # -k/--one-line-on-crash em vez de encadear "bt all" a seguir a "run" com -o: em modo
            # batch (-b) o lldb aborta a fila de comandos -o seguintes quando o processo para por
            # um sinal (ex. SIGTRAP) em vez de um breakpoint nosso — foi isto que aconteceu na
            # ronda anterior (a sessão que crashou nunca chegou a ecoar "(lldb) bt all"; a sessão
            # que saiu normalmente ecoou-o sem problema, confirmando que o comando em si estava
            # correto). -k só dispara quando o alvo efetivamente crasha, contornando esse
            # comportamento. run_with_timeout evita ficar preso indefinidamente a fazer unwind de
            # código JIT do V8 sem info de frame.
            run_with_timeout 40 "lldb na app real" \
              lldb -b -k "bt all" -k "image list" -k "quit" -o "run" -- "$EXEC_PATH"

            echo ""
            echo "----- lldb com ELECTRON_RUN_AS_NODE=1 (isola o stack sem ruído do Chromium, só se A1 tiver rebentado) -----"
            # ELECTRON_RUN_AS_NODE=1 exportado para o próprio shell que invoca o lldb — o processo
            # lançado pelo lldb herda o ambiente do processo que o lançou, tal como um exec normal.
            export ELECTRON_RUN_AS_NODE=1
            run_with_timeout 40 "lldb com ELECTRON_RUN_AS_NODE=1" \
              lldb -b -k "bt all" -k "image list" -k "quit" -o "settings set target.run-args -e console.log(1)" -o "run" -- "$EXEC_PATH"
            unset ELECTRON_RUN_AS_NODE

            echo "===================================================="
            echo "CONTROLO B (extensão) — lldb sobre o hello-world, só se A2 confirmou que o Electron virgem também crasha"
            echo "===================================================="
            if [ "$A2_VERDICT" = "ELECTRON_OU_AMBIENTE" ] && [ -n "$HELLO_ELECTRON_REAL_BIN" ]; then
              echo "----- lldb no hello-world (Electron virgem, mesmas flags do A2) -----"
              run_with_timeout 40 "lldb no hello-world" \
                lldb -b -k "bt all" -k "image list" -k "quit" -o "settings set target.run-args $HELLO_DIR --no-sandbox --disable-gpu" -o "run" -- "$HELLO_ELECTRON_REAL_BIN"
            else
              echo "(A2 não confirmou crash no Electron virgem — veredito=$A2_VERDICT — a saltar. Comparar com o backtrace da app real acima.)"
            fi

            echo "===================================================="
            echo "MUDANÇA DE MODO: a partir daqui já não é só diagnóstico — testa candidatos a"
            echo "correção, por ordem, e para no primeiro que passe o smoke test (exit 0)."
            echo "===================================================="
            CANDIDATE_ROWS=()
            record_row () { CANDIDATE_ROWS+=("$1|$2|$3"); }
            WINNER=""

            echo "===================================================="
            echo "C1 — stub mínimo (só decide o caminho a seguir; nunca é publicável)"
            echo "===================================================="
            # Reconstrução completa via electron-builder (não cirurgia manual no app.asar já
            # assinado): o Info.plist tem ElectronAsarIntegrity (hash do app.asar embebido no
            # build), e a app já está assinada ad-hoc — trocar o asar in-place invalidaria esse
            # hash/assinatura, arriscando um "crash" que seria só a verificação de integridade a
            # recusar carregar, contaminando o resultado. Voltar a chamar o electron-builder
            # recalcula tudo isso corretamente.
            printf '%s\n' \
              "const { app, BrowserWindow } = require('electron')" \
              "app.whenReady().then(() => {" \
              "  new BrowserWindow({ width: 400, height: 300, show: false })" \
              "  console.log('C1_STUB_MINIMO: BrowserWindow created OK')" \
              "  setTimeout(() => app.quit(), 1000)" \
              "})" \
              > out/main/index.js
            npx electron-builder --mac --publish never > "$RUNNER_TEMP/build-C1.log" 2>&1
            echo "electron-builder exit (C1): $?"
            tail -30 "$RUNNER_TEMP/build-C1.log"
            C1_APP_PATH=$(find dist -maxdepth 2 -iname "*.app" -type d | head -1)
            C1_EXEC_PATH=$(find "$C1_APP_PATH/Contents/MacOS" -maxdepth 1 -type f | head -1)
            run_with_timeout 20 "C1 stub mínimo — smoke test" \
              env ELECTRON_ENABLE_LOGGING=1 "$C1_EXEC_PATH"
            C1_EXIT="$LAST_EXIT_CODE"
            record_row "C1-stub-minimo" "$C1_EXIT" "diagnóstico apenas, nunca publicável"
            # out/ é gerado — repõe-se limpo a partir do TypeScript original antes dos candidatos
            # seguintes (nenhum deles deve herdar o stub do C1).
            npm run build > "$RUNNER_TEMP/rebuild-out-after-c1.log" 2>&1
            echo "npm run build (repor out/ limpo) exit: $?"

            if [ "$C1_EXIT" = "0" ]; then
              echo ">>> C1 arranca -> bug no código de arranque da app. A testar C2/C3. <<<"
              TRY_C2_C3="true"
            else
              echo ">>> C1 também rebenta (exit $C1_EXIT) -> bug no Electron/empacotamento, não no código da app. A saltar C2/C3, direto a C4/C5. <<<"
              TRY_C2_C3="false"
            fi

            # v0.8.47-rc1 já existe (tag+release de uma ronda anterior, noutro commit) — usa-se
            # rc2 para o candidato vencedor desta ronda, se algum passar. Aplicado já aqui, antes
            # de qualquer candidato, para que o build que passa no smoke test seja byte-a-byte o
            # mesmo que fica publicado — sem rebuild extra depois de decidir o vencedor.
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              p.version = '0.8.47-rc2';
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            "
            echo "versão candidata desta ronda:"; grep '"version"' package.json

            mkdir -p "$RUNNER_TEMP/orig-src"
            cp src/main/index.ts "$RUNNER_TEMP/orig-src/index.ts"
            cp src/main/ipc.ts "$RUNNER_TEMP/orig-src/ipc.ts"
            cp package.json "$RUNNER_TEMP/orig-src/package.json"
            cp package-lock.json "$RUNNER_TEMP/orig-src/package-lock.json"
            restore_baseline () {
              cp "$RUNNER_TEMP/orig-src/index.ts" src/main/index.ts
              cp "$RUNNER_TEMP/orig-src/ipc.ts" src/main/ipc.ts
              cp "$RUNNER_TEMP/orig-src/package.json" package.json
              cp "$RUNNER_TEMP/orig-src/package-lock.json" package-lock.json
            }

            if [ "$TRY_C2_C3" = "true" ] && [ -z "$WINNER" ]; then
              echo "===================================================="
              echo "C2 — initDatabase() preguiçoso (sql.js/WASM só numa query real, nunca no boot)"
              echo "===================================================="
              restore_baseline
              cp .github/build-candidates/c2-ipc.ts src/main/ipc.ts
              cp .github/build-candidates/c2-index.ts src/main/index.ts
              npm run build > "$RUNNER_TEMP/build-src-C2.log" 2>&1
              echo "npm run build (C2) exit: $?"; tail -30 "$RUNNER_TEMP/build-src-C2.log"
              npx electron-builder --mac --publish never > "$RUNNER_TEMP/build-C2.log" 2>&1
              echo "electron-builder exit (C2): $?"; tail -30 "$RUNNER_TEMP/build-C2.log"
              C2_APP_PATH=$(find dist -maxdepth 2 -iname "*.app" -type d | head -1)
              C2_EXEC_PATH=$(find "$C2_APP_PATH/Contents/MacOS" -maxdepth 1 -type f | head -1)
              run_with_timeout 20 "C2 lazy db — smoke test" \
                env ELECTRON_ENABLE_LOGGING=1 "$C2_EXEC_PATH"
              C2_EXIT="$LAST_EXIT_CODE"
              record_row "C2-lazy-db" "$C2_EXIT" ""
              if [ "$C2_EXIT" = "0" ]; then
                WINNER="C2-lazy-db"
                echo ">>> C2 arrancou (exit 0) — candidato vencedor. <<<"
              fi
            fi

            if [ "$TRY_C2_C3" = "true" ] && [ -z "$WINNER" ]; then
              echo "===================================================="
              echo "C3 — janela primeiro, IPC/DB só depois de did-finish-load"
              echo "===================================================="
              restore_baseline
              cp .github/build-candidates/c3-index.ts src/main/index.ts
              npm run build > "$RUNNER_TEMP/build-src-C3.log" 2>&1
              echo "npm run build (C3) exit: $?"; tail -30 "$RUNNER_TEMP/build-src-C3.log"
              npx electron-builder --mac --publish never > "$RUNNER_TEMP/build-C3.log" 2>&1
              echo "electron-builder exit (C3): $?"; tail -30 "$RUNNER_TEMP/build-C3.log"
              C3_APP_PATH=$(find dist -maxdepth 2 -iname "*.app" -type d | head -1)
              C3_EXEC_PATH=$(find "$C3_APP_PATH/Contents/MacOS" -maxdepth 1 -type f | head -1)
              run_with_timeout 20 "C3 janela primeiro — smoke test" \
                env ELECTRON_ENABLE_LOGGING=1 "$C3_EXEC_PATH"
              C3_EXIT="$LAST_EXIT_CODE"
              record_row "C3-janela-primeiro" "$C3_EXIT" ""
              if [ "$C3_EXIT" = "0" ]; then
                WINNER="C3-janela-primeiro"
                echo ">>> C3 arrancou (exit 0) — candidato vencedor. <<<"
              fi
            fi

            if [ -z "$WINNER" ]; then
              echo "===================================================="
              echo "C4 — Electron 43.2.0 (versão anterior ao upgrade da v0.8.46)"
              echo "===================================================="
              restore_baseline
              npm run build > "$RUNNER_TEMP/build-src-C4.log" 2>&1
              echo "npm run build (C4, código original) exit: $?"
              npm install --save-exact electron@43.2.0 > "$RUNNER_TEMP/npm-install-C4.log" 2>&1
              echo "npm install electron@43.2.0 exit: $?"; tail -20 "$RUNNER_TEMP/npm-install-C4.log"
              npx electron-builder --mac --publish never > "$RUNNER_TEMP/build-C4.log" 2>&1
              echo "electron-builder exit (C4): $?"; tail -30 "$RUNNER_TEMP/build-C4.log"
              C4_APP_PATH=$(find dist -maxdepth 2 -iname "*.app" -type d | head -1)
              C4_EXEC_PATH=$(find "$C4_APP_PATH/Contents/MacOS" -maxdepth 1 -type f | head -1)
              run_with_timeout 20 "C4 Electron 43.2.0 — smoke test" \
                env ELECTRON_ENABLE_LOGGING=1 "$C4_EXEC_PATH"
              C4_EXIT="$LAST_EXIT_CODE"
              record_row "C4-electron-43.2.0" "$C4_EXIT" ""
              if [ "$C4_EXIT" = "0" ]; then
                WINNER="C4-electron-43.2.0"
                echo ">>> C4 arrancou (exit 0) — candidato vencedor. <<<"
              fi
            fi

            if [ -z "$WINNER" ]; then
              echo "===================================================="
              echo "C5 — Electron 42.9.3 (última stable fora da série 43; confirmado agora via"
              echo "releases.electronjs.org — 44/45 só têm nightly nesta data, sem stable ainda)"
              echo "===================================================="
              restore_baseline
              npm run build > "$RUNNER_TEMP/build-src-C5.log" 2>&1
              echo "npm run build (C5, código original) exit: $?"
              npm install --save-exact electron@42.9.3 > "$RUNNER_TEMP/npm-install-C5.log" 2>&1
              echo "npm install electron@42.9.3 exit: $?"; tail -20 "$RUNNER_TEMP/npm-install-C5.log"
              npx electron-builder --mac --publish never > "$RUNNER_TEMP/build-C5.log" 2>&1
              echo "electron-builder exit (C5): $?"; tail -30 "$RUNNER_TEMP/build-C5.log"
              C5_APP_PATH=$(find dist -maxdepth 2 -iname "*.app" -type d | head -1)
              C5_EXEC_PATH=$(find "$C5_APP_PATH/Contents/MacOS" -maxdepth 1 -type f | head -1)
              run_with_timeout 20 "C5 Electron 42.9.3 — smoke test" \
                env ELECTRON_ENABLE_LOGGING=1 "$C5_EXEC_PATH"
              C5_EXIT="$LAST_EXIT_CODE"
              record_row "C5-electron-42.9.3" "$C5_EXIT" ""
              if [ "$C5_EXIT" = "0" ]; then
                WINNER="C5-electron-42.9.3"
                echo ">>> C5 arrancou (exit 0) — candidato vencedor. <<<"
              fi
            fi

            if [ -z "$WINNER" ]; then
              restore_baseline
            fi

            echo "===================================================="
            echo "TABELA DE RESULTADOS"
            echo "===================================================="
            printf '%-22s | %-8s | %s\n' "candidato" "exit" "nota"
            printf -- '-----------------------|----------|--------------------------------------------\n'
            for row in "${CANDIDATE_ROWS[@]}"; do
              IFS='|' read -r cname cexit cnote <<< "$row"
              printf '%-22s | %-8s | %s\n' "$cname" "$cexit" "$cnote"
            done
            echo ""
            if [ -n "$WINNER" ]; then
              echo ">>> VENCEDOR: $WINNER <<<"
            else
              echo ">>> NENHUM CANDIDATO PASSOU O SMOKE TEST. Não publico nada — ver tabela e backtraces do lldb acima. <<<"
            fi

            if [ -n "$WINNER" ]; then
              echo "===================================================="
              echo "PUBLICAÇÃO AUTOMÁTICA — $WINNER passou o smoke test (exit 0), a aplicar ao repositório"
              echo "===================================================="
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              rm -rf .github/build-candidates
              git add -A src/main/index.ts src/main/ipc.ts package.json package-lock.json .github/build-candidates
              git status --short
              # Mensagem via ficheiro (git commit -F), não -m com string multi-linha inline: uma
              # string bash com quebras de linha embutida diretamente num bloco literal YAML
              # (run: |) precisa de todas as linhas indentadas ao nível do bloco — já apanhámos
              # este exato problema com heredocs antes; -F evita repeti-lo aqui.
              COMMIT_MSG_FILE="$RUNNER_TEMP/commit-message.txt"
              printf '%s\n' \
                "0.8.47-rc2: aplica candidato $WINNER (corrige o crash de arranque no macOS)" \
                "" \
                "Escolhido automaticamente pela ronda de testes desta run — ver" \
                "ci-diagnostics/${{ github.sha }}.md para a tabela completa de candidatos" \
                "(C1-C5) e os backtraces lldb. Critério de aceitação: o smoke test no runner" \
                "macos-latest chega a exit code 0 (a app arranca), em vez do SIGTRAP/exit 133" \
                "anterior, reproduzido em todas as versões publicadas até agora." \
                "" \
                "Build de teste, validado apenas no arranque — abrir vídeo, gravar na base de" \
                "dados e chamar o ffmpeg continuam por confirmar num Mac real." \
                > "$COMMIT_MSG_FILE"
              git commit -F "$COMMIT_MSG_FILE"
              git push origin HEAD:refs/heads/main
              PUSH_EXIT=$?
              echo "git push (main) exit: $PUSH_EXIT"
              if [ "$PUSH_EXIT" != "0" ]; then
                echo "ERRO: push para main falhou — a abortar publicação automática sem criar tag/release. Ver o log acima."
              else
                git tag v0.8.47-rc2
                git push origin v0.8.47-rc2
                echo "git push (tag v0.8.47-rc2) exit: $?"

                NOTES_FILE="$RUNNER_TEMP/release-notes.md"
                printf '%s\n' \
                  "Build de teste — candidato de correção **$WINNER** para o crash de arranque no macOS (EXC_BREAKPOINT/SIGTRAP, thread CrBrowserMain, morre em milissegundos antes de qualquer janela abrir)." \
                  "" \
                  "**O que este build prova:** o smoke test automático no runner macOS confirma que a app agora ARRANCA (exit code 0) — antes disto, exit 133 em 100% das tentativas, em todas as versões publicadas até agora (v0.8.42 a v0.8.46, e os candidatos v0.8.47-rc1/rc2 anteriores)." \
                  "" \
                  "**O que este build NÃO prova:** o smoke test só confirma o arranque, não a funcionalidade. Abrir vídeos, gravar na base de dados e chamar o ffmpeg continuam por testar num Mac real." \
                  "" \
                  "Tabela completa dos candidatos testados nesta ronda (C1-C5) e os backtraces lldb: https://raw.githubusercontent.com/${{ github.repository }}/ci-diagnostics/${{ github.sha }}.md" \
                  > "$NOTES_FILE"

                gh release create v0.8.47-rc2 \
                  dist/*.dmg dist/*.dmg.blockmap dist/*.zip dist/latest-mac.yml \
                  --title "v0.8.47-rc2 ($WINNER)" \
                  --notes-file "$NOTES_FILE" \
                  --prerelease
                echo "gh release create exit: $?"
              fi
            fi
          } | tee controls-full-report.txt

          {
            echo ""
            echo "## Controlos A/B — ${{ github.ref_name }} (${{ github.sha }})"
            echo '```'
            cat controls-full-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0
      # Visibilidade c) — o relatório fica também commitado num branch órfão dedicado
      # (ci-diagnostics), legível sem qualquer autenticação via
      # raw.githubusercontent.com/<owner>/<repo>/ci-diagnostics/<sha>.md — não depende da API do
      # GitHub nem de um token para ler, ao contrário dos logs do run e dos artifacts. Checkout
      # próprio e isolado num diretório temporário, para não interferir com o checkout principal
      # do job (que tem de continuar na tag/branch a ser construída).
      - name: Publicar diagnóstico no branch ci-diagnostics
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          WORKDIR=$(mktemp -d)
          cd "$WORKDIR"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q origin ci-diagnostics 2>/dev/null; then
            git checkout -q ci-diagnostics
          else
            git checkout -q --orphan ci-diagnostics
            git rm -rf . -q 2>/dev/null
          fi
          {
            echo "# Smoke test"
            cat "$GITHUB_WORKSPACE/smoke-full-report.txt" 2>/dev/null || echo "(sem smoke-full-report.txt)"
            echo ""
            echo "# Controlos A/B"
            cat "$GITHUB_WORKSPACE/controls-full-report.txt" 2>/dev/null || echo "(sem controls-full-report.txt)"
          } > "./${{ github.sha }}.md"
          git add "${{ github.sha }}.md"
          git commit -q -m "Diagnóstico smoke test macOS — ${{ github.ref_name }} (${{ github.sha }})"
          git push -q origin ci-diagnostics
          echo "Diagnóstico publicado em: https://raw.githubusercontent.com/${{ github.repository }}/ci-diagnostics/${{ github.sha }}.md"
      # Release: gh CLI (pré-instalado nos runners, usa GITHUB_TOKEN) em vez da action
      # softprops/action-gh-release — mais robusto a falhas de rede transitórias
      # ("Too many retries" observado numa ronda anterior). `gh release create` falha se o
      # release da tag já existir (ex. o workflow Windows já o criou primeiro) — nesse caso o
      # fallback `gh release upload --clobber` anexa os ficheiros ao release já existente, sem
      # recriar nada.
      - name: Publicar release (gh CLI)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Salvaguarda contra o próprio passo "Controlos A/B + candidatos" acima: quando um
          # candidato vence, esse passo cria e empurra a tag diretamente (só corre em
          # workflow_dispatch) e já publica o release com os assets EXATOS que passaram no smoke
          # test. Empurrar essa tag despoleta este mesmo workflow outra vez, agora como push de
          # tag — sem esta guarda, este passo reconstruiria tudo do zero e sobrescreveria
          # (--clobber) os assets já testados por um rebuild equivalente mas não idêntico.
          EXISTING_ASSETS=$(gh release view "${{ github.ref_name }}" --json assets --jq '.assets | length' 2>/dev/null || echo "0")
          if [ "$EXISTING_ASSETS" != "0" ] && [ -n "$EXISTING_ASSETS" ]; then
            echo "Release ${{ github.ref_name }} já tem $EXISTING_ASSETS asset(s) — provavelmente publicados diretamente pela ronda de candidatos. A saltar para não sobrescrever com um rebuild redundante."
            exit 0
          fi
          PRERELEASE_FLAG=""
          case "${{ github.ref_name }}" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "${{ github.ref_name }}" \
            dist/*.dmg dist/*.dmg.blockmap dist/*.zip dist/latest-mac.yml \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            $PRERELEASE_FLAG \
            || gh release upload "${{ github.ref_name }}" \
                 dist/*.dmg dist/*.dmg.blockmap dist/*.zip dist/latest-mac.yml \
                 --clobber
