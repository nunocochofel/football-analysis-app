name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. electron-builder's built-in GitHub publisher has a real bug
      # when multiple artifacts (dmg + blockmap + latest-mac.yml) all race to create the release
      # for a brand-new tag at once: every artifact's upload task independently tries to CREATE
      # the release, only one can ever win that race, and the rest fail hard with a 422 instead of
      # falling back to "release already exists, just upload to it" — confirmed by direct
      # reproduction (multiple clean reruns, with and without a pre-existing release, all failed
      # identically). softprops/action-gh-release below is a dedicated, widely-used action that
      # correctly finds-or-creates the release for the tag once, then uploads every file — no race.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      #
      # Fase macOS — distribuição gratuita, sem Apple Developer: package.json's mac.identity é
      # "-" (assinatura ad-hoc, local, gerada na hora pelo próprio codesign do macOS) — NÃO
      # precisa de nenhum certificado, conta ou secret da Apple. Isto substitui um `identity:
      # null` anterior (sem assinatura nenhuma), que deixava o FFmpeg empacotado em risco de ser
      # bloqueado pelo Gatekeeper mesmo depois de o utilizador autorizar a app principal — ver o
      # relatório da Fase macOS. Sem notarização (exigiria conta Apple Developer paga): o
      # utilizador vê o aviso normal "developer não identificado" na primeira execução e autoriza
      # pelo mecanismo do próprio macOS (Definições → Privacidade e Segurança → "Abrir mesmo
      # assim") — documentado em docs/INSTALL-MAC.md.
      - run: npx electron-builder --mac --publish never
      # Smoke test no próprio runner macOS: o crash reportado acontece durante o bootstrap do
      # Node/Electron, antes de qualquer janela abrir — por isso é detetável mesmo sem sessão
      # gráfica completa no runner. continue-on-error: true de propósito — queremos o diagnóstico
      # mesmo (sobretudo) quando a app rebenta, nunca falhar o workflow por causa disto.
      - name: Smoke test — arrancar a app no runner e capturar diagnóstico
        continue-on-error: true
        run: |
          APP_PATH=$(find dist -maxdepth 2 -iname "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Nenhum .app encontrado em dist/ — build do electron-builder não produziu nada, a saltar smoke test."
            exit 0
          fi
          EXEC_PATH=$(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f | head -1)
          echo "EXEC_PATH=$EXEC_PATH"

          echo "===== codesign -dvvv ====="
          codesign -dvvv "$APP_PATH" || true
          echo "===== codesign -vvv --strict ====="
          codesign -vvv --strict "$APP_PATH" || true
          echo "===== lipo -archs (executável principal) ====="
          lipo -archs "$EXEC_PATH" || true
          echo "===== ElectronAsarIntegrity (Info.plist) ====="
          /usr/libexec/PlistBuddy -c "Print :ElectronAsarIntegrity" "$APP_PATH/Contents/Info.plist" || true

          echo "===== a arrancar a app (ELECTRON_ENABLE_LOGGING=1, timeout manual 25s) ====="
          # timeout(1) não existe por omissão no BSD userland do macOS — implementado com
          # bash puro (background + watchdog) em vez de assumir coreutils/gtimeout instalado.
          ELECTRON_ENABLE_LOGGING=1 "$EXEC_PATH" > smoke-stdout.log 2> smoke-stderr.log &
          APP_PID=$!
          ( sleep 25 && kill -9 "$APP_PID" 2>/dev/null ) &
          WATCHDOG_PID=$!
          wait "$APP_PID"
          EXIT_CODE=$?
          kill "$WATCHDOG_PID" 2>/dev/null || true
          echo "exit code: $EXIT_CODE"
          echo "$EXIT_CODE" > smoke-exit-code.txt
          echo "===== stdout ====="; cat smoke-stdout.log || true
          echo "===== stderr ====="; cat smoke-stderr.log || true

          echo "===== crash reports (~/Library/Logs/DiagnosticReports) ====="
          ls -la ~/Library/Logs/DiagnosticReports/ || true
          mkdir -p crash-reports
          cp ~/Library/Logs/DiagnosticReports/*.ips crash-reports/ 2>/dev/null || echo "sem .ips gerados"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-smoke-test-${{ github.sha }}
          path: |
            smoke-stdout.log
            smoke-stderr.log
            smoke-exit-code.txt
            crash-reports/**
          retention-days: 14
          if-no-files-found: ignore
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/latest-mac.yml
