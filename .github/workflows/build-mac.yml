name: Build macOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      # Build only — no --publish. electron-builder's built-in GitHub publisher has a real bug
      # when multiple artifacts (dmg + blockmap + latest-mac.yml) all race to create the release
      # for a brand-new tag at once: every artifact's upload task independently tries to CREATE
      # the release, only one can ever win that race, and the rest fail hard with a 422 instead of
      # falling back to "release already exists, just upload to it" — confirmed by direct
      # reproduction (multiple clean reruns, with and without a pre-existing release, all failed
      # identically). softprops/action-gh-release below is a dedicated, widely-used action that
      # correctly finds-or-creates the release for the tag once, then uploads every file — no race.
      # --publish never: package.json has a "publish" config block, so electron-builder tries to
      # auto-publish even without --publish always — it needs to be told explicitly not to.
      - run: npx electron-builder --mac --publish never
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/latest-mac.yml
